<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>중국어 인증제 · 특급 도전</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 갤럭시 탭을 눕혀서 쓰는 화면에 맞췄어요. 한 화면에 다 들어가고 스크롤이 없어요.
     폰이나 세로 화면에서는 위아래로 쌓이고 스크롤돼요. */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --paper:#fff8ef; --ink:#4a3528; --muted:#9b8574;
    --red:#e2553f; --gold:#f4b73d; --line:#f0dfcb; --ok:#3f9b5a; --no:#d9534f;
    --t1:#3b82c4; --t2:#3f9b5a; --t3:#e0912b; --t4:#d94c5b;
  }
  html,body{height:100%;}
  body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 24px 16px;max-width:1400px;margin:0 auto;}
  .py{font-family:'Noto Sans','Segoe UI',sans-serif;font-weight:700;}
  .hz{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  .hide{display:none!important;}
  main{flex:1;min-height:0;display:flex;flex-direction:column;}

  /* 윗줄 */
  .top{display:flex;align-items:center;gap:12px;height:clamp(54px,8vh,76px);flex:none;margin-bottom:8px;}
  .back{background:#fff;border:2px solid var(--line);border-radius:99px;width:clamp(48px,7vh,68px);height:clamp(48px,7vh,68px);font-size:clamp(24px,3.6vh,34px);color:var(--muted);flex:none;}
  .top h2{flex:1;font-size:clamp(22px,3.8vh,36px);color:var(--red);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .krbtn{background:#fff;border:2px solid var(--line);border-radius:99px;padding:.4em .9em;font-size:clamp(17px,2.8vh,26px);color:var(--muted);font-family:'Jua',sans-serif;flex:none;}
  body.kr .krbtn{background:var(--gold);border-color:var(--gold);color:#fff;}
  .voice-warn{background:#fde8e7;color:#a33;border-radius:14px;padding:8px 12px;font-family:'Gaegu',sans-serif;font-weight:700;font-size:15px;margin-bottom:8px;}
  .ga{font-family:'Gaegu',sans-serif;font-weight:700;}

  /* ---------- 첫 화면 ---------- */
  .home{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.2fr;gap:24px;padding-top:6px;}
  .col{display:flex;flex-direction:column;gap:14px;min-height:0;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .flag{font-size:54px;}
  .brand h1{font-size:34px;color:var(--red);font-weight:400;line-height:1.1;}
  .brand .sub{font-family:'Gaegu',sans-serif;font-weight:700;font-size:17px;color:var(--muted);}
  .stats{display:flex;gap:10px;}
  .stats div{flex:1;background:#fff;border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 3px 10px rgba(180,120,80,.10);}
  .stats b{display:block;font-size:28px;color:var(--red);font-weight:400;}
  .stats span{font-family:'Gaegu',sans-serif;font-size:15px;color:var(--muted);font-weight:700;}
  .go{flex:1;min-height:150px;border:none;border-radius:28px;background:var(--red);color:#fff;padding:16px;
      box-shadow:0 7px 0 #b83d2b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .go:active{transform:translateY(5px);box-shadow:0 2px 0 #b83d2b;}
  .go .r{font-family:'Gaegu',sans-serif;font-weight:700;font-size:20px;opacity:.92;}
  .go .t{font-size:40px;}
  .go .d{font-family:'Gaegu',sans-serif;font-weight:700;font-size:19px;opacity:.92;}
  .pace{text-align:center;font-family:'Gaegu',sans-serif;font-weight:700;font-size:18px;color:#7a5a45;}
  .stampbox{flex:1;min-height:0;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 3px 10px rgba(180,120,80,.10);
            display:flex;flex-direction:column;justify-content:space-around;gap:6px;}
  .srow{display:flex;align-items:center;gap:10px;}
  .slab{font-family:'Gaegu',sans-serif;font-weight:700;font-size:16px;color:var(--muted);width:44px;flex:none;}
  .sgrid{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
  .st{aspect-ratio:1;max-height:5.2vh;width:100%;margin:0 auto;border:none;border-radius:9px;background:#f6ece1;color:#c9b6a4;font-size:13px;padding:0;font-family:'Jua',sans-serif;}
  .st.mk{background:#fbe3dc;}
  .st.done{background:#fff1c9;font-size:17px;}
  .st.now{background:var(--gold);color:#fff;font-size:15px;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold);}
  .menus{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .menu{display:flex;align-items:center;gap:10px;background:#fff;border:none;border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 10px rgba(180,120,80,.12);}
  .menu .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;}
  .menu .t{font-size:17px;}
  .menu .d{font-family:'Gaegu',sans-serif;font-size:14px;color:var(--muted);font-weight:700;}

  /* ---------- 카드 넘기기 ---------- */
  .pager{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;}
  .phead{display:flex;align-items:center;gap:10px;flex:none;}
  .chip{background:#fdebd9;color:var(--red);border-radius:99px;padding:.35em .9em;font-size:clamp(17px,3vh,28px);white-space:nowrap;}
  .howto{flex:1;font-family:'Jua',sans-serif;font-size:clamp(16px,2.8vh,26px);color:#9a7a55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pbtn{background:#fff;border:2px solid var(--gold);color:#b9801c;border-radius:99px;padding:.35em .9em;font-size:clamp(17px,3vh,28px);flex:none;}
  .fc{flex:1;min-height:0;background:#fff;border-radius:28px;box-shadow:0 5px 16px rgba(180,120,80,.14);
      display:flex;align-items:center;gap:20px;padding:20px 32px;position:relative;overflow:hidden;}
  .fc .body{flex:1;min-width:0;text-align:center;}
  .fc .py{font-size:clamp(34px,13vh,130px);line-height:1.2;}
  .fc .py.long{font-size:clamp(28px,8vh,84px);}
  .fc .hz{font-size:clamp(18px,5.5vh,52px);color:var(--muted);margin-top:6px;}
  .fc .ko{font-family:'Jua',sans-serif;font-size:clamp(24px,8vh,76px);color:#7a5a45;margin-top:10px;}
  .fc .kr{font-family:'Jua',sans-serif;font-size:clamp(18px,5vh,44px);color:#c07a2a;margin-top:4px;display:none;}
  body.kr .fc .kr{display:block;}
  .fc .star{color:var(--gold);font-size:.6em;vertical-align:.25em;margin-right:6px;}
  .fc.veil .ko,.fc.veil .kr{display:none!important;}
  .fc .peek{display:none;font-family:'Jua',sans-serif;font-size:clamp(22px,5.5vh,48px);color:#d0a57a;margin-top:10px;}
  .fc.veil .peek{display:block;}
  .say{width:clamp(80px,16vh,150px);height:clamp(80px,16vh,150px);border-radius:50%;border:none;background:var(--gold);font-size:clamp(38px,7.5vh,70px);flex:none;box-shadow:0 5px 0 #d49a25;}
  .say:active{transform:translateY(3px);box-shadow:0 2px 0 #d49a25;}
  .say.sm{width:48px;height:48px;font-size:22px;box-shadow:none;background:#fdebd9;}
  .pfoot{display:flex;align-items:center;gap:14px;flex:none;}
  .arrow{width:clamp(84px,14vh,130px);height:clamp(64px,10vh,96px);border:none;border-radius:22px;background:#fff;font-size:clamp(30px,5vh,48px);color:var(--red);box-shadow:0 3px 10px rgba(180,120,80,.12);flex:none;}
  .arrow:disabled{opacity:.3;}
  .dots{flex:1;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;}
  .dots i{width:clamp(12px,1.8vh,18px);height:clamp(12px,1.8vh,18px);border-radius:50%;background:#f0dcc6;}
  .dots i.sec{background:#f7cfa6;}
  .dots i.on{background:var(--red);transform:scale(1.3);}
  .gobtn{height:clamp(64px,10vh,96px);border:none;border-radius:22px;background:var(--red);color:#fff;font-size:clamp(22px,4.2vh,40px);padding:0 1.2em;box-shadow:0 5px 0 #b83d2b;flex:none;}

  /* 카드 안 판: 성조, 첫소리, 문장 틀 */
  .board{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;}
  .board .bt{font-size:24px;color:var(--red);text-align:center;}
  .tones{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .tone{background:#fffaf3;border:2px solid var(--line);border-radius:20px;padding:10px 6px;text-align:center;}
  .tone svg{width:80px;height:46px;display:block;margin:0 auto;}
  .tone .py{font-size:clamp(30px,7vh,52px);}
  .tone .ko{font-family:'Gaegu',sans-serif;font-weight:700;font-size:16px;color:var(--muted);}
  .c1{color:var(--t1)}.c2{color:var(--t2)}.c3{color:var(--t3)}.c4{color:var(--t4)}
  .rule{font-family:'Gaegu',sans-serif;font-weight:700;font-size:20px;color:#7a5a30;text-align:center;line-height:1.5;}
  .rule .py{font-family:'Noto Sans',sans-serif;font-size:18px;}
  .ini{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .ini.few{grid-template-columns:repeat(4,1fr);}
  .ini button{background:#fffaf3;border:2px solid var(--line);border-radius:16px;padding:8px 4px;}
  .ini .l{font-family:'Noto Sans',sans-serif;font-weight:700;font-size:clamp(22px,4.6vh,34px);color:var(--red);}
  .ini .w{font-family:'Noto Sans',sans-serif;font-size:15px;font-weight:700;}
  .ini .k{font-family:'Gaegu',sans-serif;font-size:14px;color:var(--muted);font-weight:700;}
  .pat{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;}
  .pat div{background:#fffaf3;border-radius:14px;padding:10px 14px;}
  .pat .py{font-size:22px;} .pat .ga{font-size:18px;color:#7a5a45;}

  /* ---------- 문제 ----------
     화면이 넓으면 글씨와 단추도 같이 커져요 (vh 기준). 왼쪽 네모와 오른쪽 보기가 세로를 꽉 채워요. */
  .qz{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2.4vw;}
  .qleft{display:flex;flex-direction:column;gap:1.2vh;min-height:0;}
  .bar{height:14px;background:#f3e3d2;border-radius:99px;overflow:hidden;flex:none;}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s;}
  .qbox{flex:1;min-height:0;background:#fff;border-radius:28px;padding:3vh 2vw;box-shadow:0 4px 14px rgba(180,120,80,.12);
        display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;}
  .qtop{display:flex;gap:10px;align-items:center;}
  .qtype{background:#fdebd9;color:var(--red);border-radius:99px;padding:.3em .9em;font-size:clamp(17px,3vh,28px);}
  .qno{font-size:clamp(17px,3vh,28px);color:var(--muted);}
  .qask{font-size:clamp(22px,4.6vh,42px);line-height:1.3;}
  .qshow{font-size:clamp(34px,10vh,100px);line-height:1.2;}
  .qshow .hz{display:block;font-size:.4em;color:var(--muted);font-weight:400;margin-top:.2em;}
  .qshow.koq{font-family:'Jua',sans-serif;font-weight:400;color:#7a5a45;font-size:clamp(34px,10vh,96px);}
  .qsub{font-family:'Jua',sans-serif;color:#7a5a45;font-size:clamp(26px,6.4vh,60px);}
  .qsub.long{font-size:clamp(20px,4vh,38px);}
  .qshow.long{font-size:clamp(28px,7.4vh,72px);}
  .qshow.koq.long{font-size:clamp(28px,7vh,66px);}
  .qsub .lab{display:inline-block;background:#fdebd9;color:var(--red);border-radius:99px;padding:.1em .5em;font-size:.55em;vertical-align:.3em;margin-right:.3em;}
  .blank{display:inline-block;width:2.2em;height:.9em;border-bottom:.09em solid var(--gold);margin:0 .15em;vertical-align:-.1em;}
  .listen{width:clamp(80px,17vh,160px);height:clamp(80px,17vh,160px);border-radius:50%;border:none;background:var(--gold);font-size:clamp(38px,8vh,76px);box-shadow:0 6px 0 #d49a25;flex:none;}
  .listen:active{transform:translateY(4px);box-shadow:0 2px 0 #d49a25;}
  .qright{display:flex;flex-direction:column;gap:1.6vh;min-height:0;}
  .opts{flex:1;min-height:0;display:grid;gap:1.6vh 1.2vw;grid-auto-rows:1fr;}
  .opts.two{grid-template-columns:1fr 1fr;}
  .opt{background:#fff;border:4px solid var(--line);border-radius:24px;padding:1vh 1.2vw;font-size:clamp(22px,6.2vh,58px);text-align:center;
       display:flex;align-items:center;justify-content:center;gap:.4em;min-height:0;}
  .opt .py{font-size:inherit;}
  .opt.kotext{font-family:'Jua',sans-serif;font-size:clamp(20px,5vh,46px);}
  .opt.long{font-size:clamp(20px,4.6vh,44px);}
  .opt.ok{border-color:var(--ok);background:#e5f5ea;animation:pop .3s;}
  .opt.no{border-color:var(--no);background:#fde8e7;animation:shake .3s;}
  .opt .num{width:1.3em;height:1.3em;border-radius:50%;background:#f3e3d2;font-size:.45em;line-height:1.3em;color:var(--muted);font-family:'Jua',sans-serif;flex:none;}
  .fb{display:flex;align-items:center;gap:1vw;background:#fff;border-radius:22px;padding:1.4vh 1.2vw;flex:none;}
  .fb .body{flex:1;min-width:0;}
  .fb .res{font-size:clamp(20px,4vh,36px);} .fb .res.ok{color:var(--ok);} .fb .res.no{color:var(--no);}
  .fb .line{font-size:clamp(18px,3.4vh,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fb .ko{font-family:'Jua',sans-serif;color:#7a5a45;font-size:clamp(18px,3.4vh,30px);}
  .fb .kr{font-family:'Jua',sans-serif;color:#c07a2a;font-size:clamp(16px,3vh,26px);display:none;}
  body.kr .fb .kr{display:block;}
  .fb .say.sm{width:clamp(48px,8vh,76px);height:clamp(48px,8vh,76px);font-size:clamp(22px,4vh,36px);}
  .fb .gobtn{height:clamp(56px,10vh,96px);font-size:clamp(20px,4.4vh,40px);padding:0 1.6vw;}

  /* ---------- 결과 ---------- */
  .res2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.2fr;gap:22px;}
  .rleft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;}
  .medal{font-size:84px;}
  .sc{font-size:60px;color:var(--red);}
  .gr{font-size:30px;}
  .msg{font-family:'Gaegu',sans-serif;font-weight:700;font-size:20px;color:var(--muted);}
  .stamp{width:118px;height:118px;border-radius:50%;border:5px solid var(--red);color:var(--red);display:flex;flex-direction:column;
         align-items:center;justify-content:center;font-size:44px;transform:rotate(-12deg);animation:stampin .45s ease-out both;}
  .stamp span{font-size:17px;}
  .rright{background:#fff;border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;min-height:0;box-shadow:0 3px 10px rgba(180,120,80,.10);}
  .rright h3{font-size:20px;color:var(--red);font-weight:400;margin-bottom:8px;}
  .wl{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;}
  .wi{display:flex;align-items:center;gap:8px;background:#fffaf3;border-radius:14px;padding:8px 10px;}
  .wi .body{flex:1;min-width:0;}
  .wi .py{font-size:18px;} .wi .ga{font-size:16px;color:#7a5a45;}
  .rbtns{display:flex;gap:10px;margin-top:8px;}
  .big{flex:1;border:none;border-radius:20px;background:var(--red);color:#fff;font-size:22px;padding:14px 18px;}
  .big.sub{background:#fff;color:var(--red);border:2px solid var(--red);}

  /* ---------- 꼭 외울 것 · 교재 ---------- */
  .tabs{display:flex;gap:8px;flex:none;}
  .tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-size:18px;color:var(--muted);}
  .tab.on{background:var(--red);border-color:var(--red);color:#fff;}
  .page{flex:1;min-height:0;background:#fff;border-radius:26px;padding:18px 22px;box-shadow:0 4px 14px rgba(180,120,80,.12);display:flex;flex-direction:column;overflow:auto;}
  .slist{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;align-content:start;}
  .units{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px;}
  .unit{background:#fff;border:none;border-radius:20px;padding:12px;box-shadow:0 3px 10px rgba(180,120,80,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;}
  .unit .n{font-size:32px;}
  .unit .t{font-size:18px;}
  .unit .d{font-family:'Noto Sans',sans-serif;font-size:13px;color:var(--muted);font-weight:500;}

  @keyframes pop{50%{transform:scale(1.05)}}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes stampin{0%{transform:scale(2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* 키가 작은 태블릿 */
  @media (max-height:640px) and (orientation:landscape){
    .medal{font-size:60px;} .sc{font-size:46px;} .gr{font-size:24px;} .msg{font-size:17px;}
    .stamp{width:90px;height:90px;font-size:32px;} .stamp span{font-size:14px;}
    .pat{gap:6px 16px;} .pat div{padding:6px 12px;} .pat .py{font-size:18px;} .pat .ga{font-size:15px;}
    .board{gap:8px;} .board .bt{font-size:20px;}
  }
  /* 세로 화면·폰: 위아래로 쌓고 스크롤 */
  @media (orientation:portrait), (max-width:760px){
    body{overflow:auto;}
    .app{height:auto;min-height:100dvh;padding:12px 14px 24px;}
    .home,.qz,.res2{grid-template-columns:1fr;}
    .go{min-height:140px;}
    .menus{grid-template-columns:1fr;}
    .fc{min-height:52vh;flex-direction:column;padding:24px 18px;}
    .tones{grid-template-columns:1fr 1fr;}
    .ini{grid-template-columns:repeat(3,1fr);}
    .pat,.slist,.wl{grid-template-columns:1fr;}
    .units{grid-template-columns:1fr 1fr;}
    .qbox{min-height:40vh;}
    .howto{white-space:normal;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top hide" id="top">
    <button class="back" id="back" aria-label="뒤로">‹</button>
    <h2 id="ttl"></h2>
    <button class="krbtn" id="krbtn">한글 발음</button>
  </div>
  <div id="warn"></div>
  <main id="view"></main>
</div>

<script>

/* ================================================================
   교재 내용
   - 발음책: 『发音, 你好! 1』
   - 이야기책: 『汉语, 你是谁? 1』 (이야기 3편)
   py 병음 · hz 한자 · ko 뜻 · kr 한글 발음(도움용) · star 꼭 외울 것
   a: 음원 파일 이름 (CD 음원을 넣으면 채웁니다. 없으면 폰 목소리로 읽어요)
   ================================================================ */

const EXAM_DAY = '2026-12-14';

/* 성조 */
const TONES = [
  {py:'mā', hz:'妈', ko:'엄마',   t:1, name:'1성', how:'높고 평평하게 쭉~'},
  {py:'má', hz:'麻', ko:'삼베',   t:2, name:'2성', how:'아래에서 위로 올리며 ↗'},
  {py:'mǎ', hz:'马', ko:'말(동물)', t:3, name:'3성', how:'내려갔다가 올라와요 ✓'},

const MARK = {a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
const UNMARK = {};
Object.keys(MARK).forEach(function(v){
  MARK[v].split('').forEach(function(c,i){ UNMARK[c]=[v,i+1]; UNMARK[c.toUpperCase()]=[v.toUpperCase(),i+1]; });
});
function parseSyl(s){
  let base='',tone=0;
  for(const ch of s){ if(UNMARK[ch]){ base+=UNMARK[ch][0]; tone=UNMARK[ch][1]; } else base+=ch; }
  return {base:base,tone:tone};
}
function markSyl(base,tone){
  if(!tone) return base;
  const lo=base.toLowerCase(); let i=lo.indexOf('a');
  if(i<0) i=lo.indexOf('e');
  if(i<0) i=lo.indexOf('ou');
  if(i<0){ for(let k=lo.length-1;k>=0;k--){ if('iouü'.indexOf(lo[k])>=0){ i=k; break; } } }
  if(i<0) return base;
  let m=MARK[lo[i]][tone-1]; if(base[i]!==lo[i]) m=m.toUpperCase();
  return base.slice(0,i)+m+base.slice(i+1);
}

  const m=/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/.exec(parseSyl(w).base.toLowerCase());
  return m?m[1]:null;
}
/* 성조만 바꾼 가짜 보기들 */
function toneFakes(w){
  const syl=splitWord(w); if(!syl) return [];
  const idx=[]; syl.forEach(function(s,i){ if(parseSyl(s).tone) idx.push(i); });
  if(!idx.length) return [];
  const out=[];
  shuffle(idx).forEach(function(i){
    const p=parseSyl(syl[i]);
    [1,2,3,4].forEach(function(t){
      if(t===p.tone) return;
      const c=syl.slice(); c[i]=markSyl(p.base,t); out.push(c.join(''));
    });
  });
  return uniq(out).filter(function(x){ return x!==w; });
}
/* 문장 → 낱말 조각 */
function tokens(py){ return py.replace(/[.!?,，。！？]/g,'').split(/\s+/).filter(Boolean); }
function endMark(py){ const m=/[.!?]$/.exec(py); return m?m[0]:'.'; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function joinSent(tk,end){ return cap(tk.join(' '))+end; }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function mc(correct,fakes,n){
  const o=shuffle([correct].concat(shuffle(uniq(fakes).filter(function(x){ return x!==correct; })).slice(0,(n||4)-1)));

const Q = {

  tone:function(w){

  initial:function(w){

    return Object.assign({kind:'듣고 첫소리 고르기',ask:'첫소리(성모)는 무엇일까요?',audio:w,item:w,py:true,two:true},mc(ini,f));

    return Object.assign({kind:'듣고 고르기',ask:'들리는 단어는?',audio:w,item:w,py:true},mc(w.py,pool.concat(toneFakes(w.py).slice(0,1))));

  wmean:function(w){

  /* 한국말 → 단어 */
  kword:function(w){
    const pool=ALLW.filter(function(x){ return x.ko!==w.ko && x.src===w.src; }).map(function(x){ return x.py; });
    return Object.assign({kind:'중국어로 뭐예요?',ask:'중국어로 무엇일까요?',showKo:w.ko,item:w,py:true,two:true},mc(w.py,pool));
  },
  /* 문장 뜻 */
  smean:function(s){
    const pool=ALLS.filter(function(x){ return x.ko!==s.ko; }).map(function(x){ return x.ko; });
    return Object.assign({kind:'문장 뜻 고르기',ask:'무슨 뜻일까요?',show:s.py,showHz:s.hz,audio:s,item:s,ko:true},mc(s.ko,shuffle(pool.filter(function(k,i){ return i<40; }))));
  },
  /* 한국말 → 문장 */
  ksent:function(s){
    const pool=ALLS.filter(function(x){ return x.py!==s.py && x.src===s.src; }).map(function(x){ return x.py; });
    return Object.assign({kind:'이럴 때 뭐라고 해요?',ask:'알맞은 말은?',showKo:s.ko,item:s,py:true},mc(s.py,pool));

    const shown=tk.map(function(t,k){ return k===i?'<span class="blank">&nbsp;</span>':esc(t); }).join(' ')+endMark(s.py);
    return Object.assign({kind:'빈칸 채우기',ask:'빈칸에 들어갈 말은?',showHTML:shown,sub:s.ko,audio:s,item:s,py:true,two:true},mc(ans,pool.concat(toneFakes(ans))));

  order:function(s){
    const tk=tokens(s.py).map(function(t){ return t.toLowerCase(); }); if(tk.length<3) return null;

  },

  tsent:function(s){

    shuffle(tk.map(function(_,i){ return i; })).forEach(function(i){

};

function qFor(it,out){
  const ts=shuffle(typesFor(it));
  for(let i=0;i<ts.length;i++){
    const q=makeQ(ts[i],it);
    if(q && !out.some(function(o){ return o.item===q.item && o.type===q.type; })) return q;
  }
  return null;
}

function buildDayQuiz(r,D){
  const n=r===3?15:10, nS=Math.round(n*(r===1?0.6:0.7)), nP=n-nS;
  const out=[];
  const isStory=function(x){ return /^S/.test(x.src||''); };
  const sToday=Math.ceil(nS*0.7), pToday=Math.ceil(nP*0.7);
  /* 1) 틀렸던 것 먼저 (복습 칸) */
  take(out,shuffle(wrongItems(isStory)).slice(0,2),Math.min(2,nS-sToday));
  take(out,shuffle(wrongItems(function(x){ return !isStory(x); })).slice(0,1),Math.min(1,nP-pToday));
  /* 2) 오늘 것 */
  take(out,D.cards,sToday);
  take(out,D.pron,pToday);
  /* 3) 모자라면 지난 날 복습 */
  const sPrev=storyBefore(D.no), pPrev=pronBefore(D.no);
  take(out,sPrev.length?sPrev:D.cards,nS-out.filter(function(q){ return isStory(q.item); }).length);
  take(out,pPrev.length?pPrev:D.pron,n-out.length);
  take(out,D.cards,n-out.length);
  return shuffle(out).slice(0,n);
}
function buildReviewQuiz(){
  const out=[]; const stars=ALLW.concat(ALLS).filter(function(x){ return x.star; });
  take(out,shuffle(wrongItems()).slice(0,5),5);
  take(out,stars.concat(TONES),15-out.length);
  return shuffle(out);
}

}

   pages: [{it, sec}] 또는 [{board:'tone'|'ini'|'pat', sec}]
   ================================================================ */
function pager(v,pages,opt){
  let i=0;
  const secs=uniq(pages.map(function(p){ return p.sec; }));
  v.innerHTML='<div class="pager"><div class="phead"><div class="chip" id="pchip"></div><div class="howto">'+(opt.how||'')+'</div>'+
    (opt.listenAll?'<button class="pbtn" id="pall">▶ 처음부터 끝까지 듣기</button>':'')+'</div>'+
    '<div class="fc" id="fc"></div>'+
    '<div class="pfoot"><button class="arrow" id="prev" aria-label="앞 카드">◀</button><div class="dots" id="dots"></div>'+
    '<button class="arrow" id="next" aria-label="다음 카드">▶</button>'+
    (opt.done?'<button class="gobtn" id="pdone">'+opt.doneText+'</button>':'')+'</div></div>';
  function draw(auto){
    const p=pages[i], fc=$('fc');
    $('pchip').textContent=p.sec;
    fc.className='fc'+(opt.veil&&p.it?' veil':'');
    if(p.board){ fc.innerHTML=boardHTML(p.board,p.list); bindBoard(fc,p.board,p.list); }
    else {
      const it=p.it;
      fc.innerHTML='<div class="body"><div class="py'+(it.py.length>18?' long':'')+'">'+(it.star?'<span class="star">★</span>':'')+esc(it.py)+'</div>'+
        '<div class="hz">'+esc(it.hz)+'</div><div class="ko">'+esc(it.ko)+'</div>'+(it.kr?'<div class="kr">'+esc(it.kr)+'</div>':'')+
        '<div class="peek">👆 눌러서 뜻 보기</div></div><button class="say" id="say" aria-label="듣기">🔊</button>';
      fc.onclick=function(){ fc.classList.remove('veil'); play(it); };
      if(auto) setTimeout(function(){ play(it); },200);
    }
    $('prev').disabled=i===0; $('next').disabled=i===pages.length-1;
    $('dots').innerHTML=pages.map(function(q,k){ return '<i class="'+(k===i?'on':(secs.indexOf(q.sec)%2?'sec':''))+'"></i>'; }).join('');
    if($('pdone')) $('pdone').classList.toggle('hide',!opt.doneAlways && i<pages.length-1);
  }
  function move(n){ const j=i+n; if(j<0||j>=pages.length) return; stopAll(); i=j; draw(true); }
  $('prev').onclick=function(){ move(-1); };
  $('next').onclick=function(){ move(1); };
  if($('pdone')) $('pdone').onclick=function(){ stopAll(); opt.done(); };
  if(opt.listenAll) $('pall').onclick=function(){
    const idx=[]; pages.forEach(function(p,k){ if(p.it && p.sec===opt.listenAll) idx.push(k); });
    playAll(idx.map(function(k){ return pages[k].it; }),function(n){ i=idx[n]; draw(false); });
  };
  /* 손가락으로 밀어서 넘기기 */
  let sx=null;
  $('fc').addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  $('fc').addEventListener('touchend',function(e){
    if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>60) move(dx<0?1:-1);
  });
  draw(true);
}

/* 하루 공부: 이야기 카드 → 발음 카드 → 문제 */
function dayView(v,r,D){
  const pages=[];
  let listenAll=null;
  if(D.review){
    pages.push({board:'pat',sec:'★ 문장 틀'});
    pages.push({board:'pairs',sec:'★ 헷갈리는 짝'});
    uniqBy(S1S.concat(S2S,S3S).filter(function(s){ return s.star; })).forEach(function(s){ pages.push({it:s,sec:'★ 자꾸 나오는 문장'}); });
  } else {
    const sec='📖 '+STORY_NAME[D.story]+(D.listen?' · 이어 듣기':'');
    D.cards.forEach(function(it){ pages.push({it:it,sec:sec}); });
    if(D.listen) listenAll=sec;
    const psec='🔤 발음 · '+pronLabel(D.pron);
    if(D.pron===PRON_PLAN[0]) pages.push({board:'tone',sec:psec});
    else if(D.pron[0].kind==='w'){
      const inis=uniq(D.pron.map(function(w){ return initialOf(w.py); }).filter(Boolean));
      pages.push({board:'ini',list:inis,sec:psec});
    }
    D.pron.forEach(function(it){ pages.push({it:it,sec:psec}); });
  }
  const n=D.review?15:(r===3?15:10);
  pager(v,pages,{
    how:ROUND_HOW[r], veil:r===2, listenAll:listenAll,
    doneText:'문제 '+n+'개 풀기 ✏️',
    done:function(){
      const qs=D.review?buildReviewQuiz():buildDayQuiz(r,D);
      stack[stack.length-1]=[function(el){ quiz(el,qs,{r:r,d:D.no}); },r+'바퀴 '+D.no+'일차 · 문제'];
      render();
    }
  });
}

/* ================================================================
   문제 풀기 — 왼쪽 문제, 오른쪽 보기
   ================================================================ */
function quiz(v,qs,ctx){
  let i=0,score=0; const wrongs=[];
  function show(){
    const q=qs[i];
    let L='<div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div><div class="qbox">'+
      '<div class="qtop"><span class="qtype">'+q.kind+'</span><span class="qno">'+(i+1)+' / '+qs.length+'</span></div>'+
      '<div class="qask">'+q.ask+'</div>';
    if(q.show) L+='<div class="qshow py'+(q.show.length>16?' long':'')+'">'+esc(q.show)+(q.showHz?'<span class="hz">'+esc(q.showHz)+'</span>':'')+'</div>';
    if(q.showKo) L+='<div class="qshow koq">“'+esc(q.showKo)+'”</div>';
    if(q.showHTML) L+='<div class="qshow py'+(q.item.py.length>16?' long':'')+'">'+q.showHTML+'</div>';
    if(q.sub) L+='<div class="qsub"><span class="lab">뜻</span>'+esc(q.sub)+'</div>';
    if(q.audio) L+='<button class="listen" id="lis" aria-label="다시 듣기">🔊</button>';
    L+='</div>';
    let R='<div class="opts'+(q.two?' two':'')+'">';
    q.opts.forEach(function(o,k){
      R+='<button class="opt'+(q.ko?' kotext':'')+'" data-k="'+k+'"><span class="num">'+(k+1)+'</span>'+(q.py?'<span class="py">'+esc(o)+'</span>':'<span>'+esc(o)+'</span>')+'</button>';
    });
    R+='</div><div id="fb"></div>';
    v.innerHTML='<div class="qz"><div class="qleft">'+L+'</div><div class="qright">'+R+'</div></div>';
    if(q.audio){ $('lis').onclick=function(){ play(q.audio); }; setTimeout(function(){ play(q.audio); },250); }
    v.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ answer(+b.dataset.k); }; });
  }
  function answer(k){
    const q=qs[i]; const ok=k===q.ans;
    const bs=v.querySelectorAll('.opt');
    bs.forEach(function(b){ b.disabled=true; });
    bs[q.ans].classList.add('ok'); if(!ok) bs[k].classList.add('no');
    const it=q.item; const key=q.type+'|'+it.py;
    if(ok){ score++; delete DB.wrong[key]; }
    else { if(!wrongs.some(function(w){ return w.item===it; })) wrongs.push(q); DB.wrong[key]={py:it.py,type:q.type,kind:kindOf(it)}; }
    save(DB);
    $('fb').innerHTML='<div class="fb"><div class="body"><div class="res '+(ok?'ok':'no')+'">'+(ok?'딩동댕! 맞았어요 🎉':'아까워요! 정답은 '+(q.ans+1)+'번')+'</div>'+
      '<div class="line"><span class="py">'+esc(it.py)+'</span> <span class="hz" style="color:var(--muted)">'+esc(it.hz)+'</span></div><div class="ko">'+esc(it.ko)+'</div>'+
      (it.kr?'<div class="kr">'+esc(it.kr)+'</div>':'')+'</div><button class="say sm" id="fbsay">🔊</button>'+
      '<button class="gobtn" id="nx">'+(i+1<qs.length?'다음 →':'결과 보기')+'</button></div>';
    $('fbsay').onclick=function(){ play(it); };
    $('nx').onclick=function(){ i++; if(i<qs.length) show(); else result(); };
    if(!ok) setTimeout(function(){ play(it); },300);
  }
  function result(){
    const pct=Math.round(score/qs.length*100);
    let stamped=false;
    if(ctx.r){
      const k=ctx.r+'-'+ctx.d; if(!DB.stamps[k]){ DB.stamps[k]=1; stamped=true; }
      if(DB.pos.r===ctx.r && DB.pos.d===ctx.d){ DB.pos.d++; if(DB.pos.d>DAYS_PER){ DB.pos.d=1; DB.pos.r++; } }
    }
    if(ctx.mock && (DB.best==null||pct>DB.best)) DB.best=pct;
    save(DB);
    let L='';
    if(ctx.mock){
      L+='<div class="medal">'+(pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'💪')+'</div><div class="sc">'+pct+'점</div>'+
         '<div class="gr">'+gradeOf(pct)+(pct>=90?'!':'')+'</div><div class="msg">'+qs.length+'문제 중 '+score+'개 맞았어요.'+(pct<90?' 특급까지 '+Math.ceil((90-pct)*qs.length/100)+'문제 더!':'')+'</div>';
    } else {
      L+='<div class="medal">'+(pct===100?'🌟':pct>=70?'😊':'💪')+'</div><div class="sc">'+score+' / '+qs.length+'</div>'+
         '<div class="msg">'+(pct===100?'다 맞았어요!':'틀린 것은 다음 날 문제에 또 나와요.')+'</div>';
    }
    if(stamped) L+='<div class="stamp">🐼<span>도장 쾅!</span></div>';
    let R='<div class="rright"><h3>'+(wrongs.length?'틀린 것 한 번 더 보기':'틀린 것이 없어요 🎉')+'</h3><div class="wl">'+
      wrongs.map(function(q,k){ return '<div class="wi"><div class="body"><div class="py">'+esc(q.item.py)+'</div><div class="ga">'+esc(q.item.ko)+'</div></div><button class="say sm" data-i="'+k+'">🔊</button></div>'; }).join('')+
      '</div><div class="rbtns">'+(ctx.r?'':'<button class="big sub" id="again">한 번 더</button>')+'<button class="big" id="home">'+(ctx.r?'오늘 공부 끝! 처음으로':'처음으로')+'</button></div></div>';
    v.innerHTML='<div class="res2"><div class="rleft">'+L+'</div>'+R+'</div>';
    v.querySelectorAll('[data-i]').forEach(function(b){ b.onclick=function(){ play(wrongs[+b.dataset.i].item); }; });
    $('home').onclick=function(){ stack.length=1; render(); };
    if($('again')) $('again').onclick=function(){ if(ctx.wrong) wrongStart(v); else quiz(v,buildMock(),ctx); };
  }
  if(!qs.length){ v.innerHTML='<div class="page">문제를 만들지 못했어요.</div>'; return; }
  show();
}

stack.push([home,'']);
render();
</script>
</body>
</html>
