<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>초1 수학 일일 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* A5 한 장(148×210mm)에 하루치가 쏙 들어가게 만들었어요.
     주소 끝에 ?day=1 처럼 붙이면 그날 학습지, ?answers 를 붙이면 엄마용 정답지가 나와요.
     문제는 아래 DAYS 에서 고치면 돼요. */
  @page { size: A5; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #ff8fb8; --pink-d: #e8598f; --pink-l: #ffe3ee; --pink-xl: #fff4f8;
    --lav: #c9b6ff; --mint: #9fe3cf; --butter: #ffe08a;
    --ink: #5a3f52; --muted: #a07f95;
  }
  html, body { background: #f3e9ee; }
  body { font-family: 'Gaegu', sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page {
    width: 148mm; height: 210mm; margin: 0 auto; position: relative; overflow: hidden;
    background: #fff; padding: 7mm 8mm 6mm;
    display: flex; flex-direction: column;
    background-image: radial-gradient(circle, #ffd6e6 0.55mm, transparent 0.6mm);
    background-size: 7mm 7mm;
  }
  .page + .page { margin-top: 6mm; }
  @media print { html, body { background: #fff; } .page + .page { margin-top: 0; } .page { page-break-after: always; } }
  .frame { position: absolute; inset: 3.5mm; border: 0.8mm dashed var(--pink); border-radius: 6mm; pointer-events: none; }

  /* 머리 */
  header { position: relative; display: flex; align-items: flex-start; gap: 2mm; height: 33mm; flex: none; }
  .titlebox { flex: 1; padding-top: 1mm; }
  .ribbon {
    display: inline-block; font-family: 'Jua', sans-serif; font-size: 9pt; color: #fff;
    background: var(--pink); border-radius: 99px; padding: 0.6mm 3.2mm;
  }
  h1 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 21pt; color: var(--pink-d); line-height: 1.15; margin: 1.2mm 0 1.6mm; letter-spacing: -0.3pt; }
  h1 small { font-size: 13pt; color: var(--ink); margin-left: 1mm; }
  .namebar { display: flex; gap: 3mm; font-family: 'Jua', sans-serif; font-size: 9.5pt; color: var(--muted); }
  .namebar span { border-bottom: 0.35mm solid #f5bfd3; padding: 0 1mm 0.4mm; min-width: 26mm; }
  .namebar span.short { min-width: 20mm; }
  .bunny-top { width: 34mm; height: 34mm; flex: none; margin-top: -2mm; margin-right: -2mm; }
  .bubble {
    position: absolute; right: 30mm; top: 0; background: #fff; border: 0.45mm solid var(--pink);
    border-radius: 4mm; padding: 1mm 2.6mm; font-family: 'Jua', sans-serif; font-size: 8.5pt; color: var(--pink-d); white-space: nowrap;
  }
  .bubble::after {
    content: ''; position: absolute; right: -2.1mm; top: 2.2mm; width: 2.6mm; height: 2.6mm; background: #fff;
    border-right: 0.45mm solid var(--pink); border-top: 0.45mm solid var(--pink); transform: rotate(45deg);
  }

  /* 문제 */
  .qs { flex: 1; display: flex; flex-direction: column; gap: 2.6mm; min-height: 0; }
  .q {
    position: relative; flex: 1; background: rgba(255,255,255,0.94); border: 0.5mm solid var(--pink-l);
    border-radius: 4.5mm; padding: 2.6mm 3.6mm 2.6mm 11mm; display: flex; flex-direction: column; justify-content: center; gap: 1.8mm;
  }
  .q:nth-child(2) { border-color: #e7deff; } .q:nth-child(3) { border-color: #d6f3ea; } .q:nth-child(4) { border-color: #fff0c4; }
  .num {
    position: absolute; left: 2.6mm; top: 2.6mm; width: 6.4mm; height: 6.4mm; border-radius: 50%;
    background: var(--pink); color: #fff; font-family: 'Jua', sans-serif; font-size: 11pt;
    display: flex; align-items: center; justify-content: center;
  }
  .q:nth-child(2) .num { background: var(--lav); } .q:nth-child(3) .num { background: var(--mint); } .q:nth-child(4) .num { background: #f7c64f; }
  .kind { font-family: 'Jua', sans-serif; font-size: 8pt; color: var(--muted); margin-bottom: -0.6mm; }
  .text { font-family: 'Jua', sans-serif; font-size: 11.5pt; line-height: 1.45; word-break: keep-all; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 1.6mm 2.2mm; font-family: 'Jua', sans-serif; font-size: 12pt; }
  .lbl {
    font-size: 8.5pt; color: #fff; background: #f4a9c5; border-radius: 99px; padding: 0.3mm 2.2mm; margin-right: 0.4mm;
  }
  .q:nth-child(2) .lbl { background: #b9a5f2; } .q:nth-child(3) .lbl { background: #7fcdb6; } .q:nth-child(4) .lbl { background: #eab43c; }
  .box {
    display: inline-flex; align-items: center; justify-content: center;
    width: 12mm; height: 8.6mm; border: 0.45mm solid #f5a7c4; border-radius: 2.4mm; background: #fff;
    font-family: 'Jua', sans-serif; font-size: 13pt; color: var(--pink-d);
  }
  .box.wide { width: 15mm; }
  .box.sign { width: 9mm; border-style: dashed; }
  .gap { width: 3mm; }
  .cards { display: flex; gap: 2.2mm; }
  .card {
    width: 8.4mm; height: 11mm; border-radius: 1.8mm; background: linear-gradient(160deg, #fff 0%, #fff4f8 100%);
    border: 0.45mm solid var(--pink); box-shadow: 0.6mm 0.7mm 0 #ffc9dc;
    display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 15pt; color: var(--pink-d);
  }
  .q:nth-child(3) .card { border-color: #7fcdb6; box-shadow: 0.6mm 0.7mm 0 #c5ece0; color: #3f9e84; }
  .q .deco { position: absolute; right: 2.6mm; top: 2mm; font-size: 9pt; color: #ffc2d8; }
  .sub { font-size: 8.5pt; color: var(--muted); }

  /* 꼬리 */
  footer { flex: none; height: 23mm; margin-top: 2.6mm; display: flex; align-items: center; gap: 3mm; }
  .bunny-low { width: 22mm; height: 22mm; flex: none; }
  .hearts { flex: 1; font-family: 'Jua', sans-serif; font-size: 9pt; color: var(--muted); line-height: 1.5; }
  .hearts .row-h { display: flex; gap: 1.4mm; margin-top: 0.6mm; }
  .hearts svg { width: 7mm; height: 7mm; }
  .stamp {
    width: 21mm; height: 21mm; border-radius: 50%; border: 0.6mm dashed var(--pink); flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-family: 'Jua', sans-serif; font-size: 7.5pt; color: #f5a7c4; line-height: 1.25; background: #fff;
  }
  .stamp b { font-weight: 400; font-size: 13pt; color: #ffb3cf; }

  /* 정답지 */
  .ans h1 { font-size: 18pt; }
  .ansgrid { flex: 1; display: flex; flex-direction: column; gap: 3mm; }
  .ansday { background: rgba(255,255,255,.95); border: 0.5mm solid var(--pink-l); border-radius: 4mm; padding: 2.6mm 4mm; }
  .ansday h3 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 12pt; color: var(--pink-d); margin-bottom: 1mm; }
  .ansday ol { padding-left: 5mm; font-family: 'Jua', sans-serif; font-size: 11pt; line-height: 1.6; }
  .ansday li b { font-family: 'Jua', sans-serif; font-weight: 400; color: var(--pink-d); }
  .ansday .tip { font-size: 9pt; color: var(--muted); }
</style>
</head>
<body>
<div id="out"></div>

<!-- 캐릭터: 분홍 토끼 「코코」 (직접 그린 그림) -->
<template id="bunny">
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 귀 -->
  <g transform="rotate(-12 44 40)">
    <ellipse cx="44" cy="26" rx="10.5" ry="24" fill="#fff" stroke="#f08db3" stroke-width="2.4"/>
    <ellipse cx="44" cy="28" rx="5.2" ry="16" fill="#ffc2d8"/>
  </g>
  <g transform="rotate(14 76 40)">
    <ellipse cx="76" cy="26" rx="10.5" ry="24" fill="#fff" stroke="#f08db3" stroke-width="2.4"/>
    <ellipse cx="76" cy="28" rx="5.2" ry="16" fill="#ffc2d8"/>
  </g>
  <!-- 리본 -->
  <g transform="translate(78 44) rotate(16)">
    <path d="M0 0 L-11 -7 Q-14 0 -11 7 Z" fill="#ff6fa3"/>
    <path d="M0 0 L11 -7 Q14 0 11 7 Z" fill="#ff6fa3"/>
    <circle r="3.6" fill="#ff4f8e"/>
    <circle cx="-7" cy="-1.5" r="1.3" fill="#fff" opacity=".8"/>
  </g>
  <!-- 몸 -->
  <ellipse cx="60" cy="104" rx="22" ry="14" fill="#fff" stroke="#f08db3" stroke-width="2.4"/>
  <ellipse cx="60" cy="106" rx="11" ry="7" fill="#ffe3ee"/>
  <!-- 얼굴 -->
  <ellipse cx="60" cy="72" rx="33" ry="29" fill="#fff" stroke="#f08db3" stroke-width="2.4"/>
  <!-- 눈 -->
  <ellipse cx="47" cy="70" rx="4.3" ry="5.3" fill="#5a3f52"/>
  <ellipse cx="73" cy="70" rx="4.3" ry="5.3" fill="#5a3f52"/>
  <circle cx="48.6" cy="67.8" r="1.7" fill="#fff"/>
  <circle cx="74.6" cy="67.8" r="1.7" fill="#fff"/>
  <!-- 볼 -->
  <ellipse cx="39" cy="81" rx="6.5" ry="4" fill="#ffadc9" opacity=".85"/>
  <ellipse cx="81" cy="81" rx="6.5" ry="4" fill="#ffadc9" opacity=".85"/>
  <!-- 코와 입 -->
  <path d="M57.5 77 Q60 79.5 62.5 77 Q60 75.5 57.5 77 Z" fill="#ff7fab"/>
  <path d="M54 81 Q57 85 60 81 Q63 85 66 81" fill="none" stroke="#5a3f52" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 손과 연필 -->
  <g transform="translate(88 92) rotate(-35)">
    <rect x="-3" y="-20" width="6" height="22" rx="1.2" fill="#ffd36e" stroke="#e0a93a" stroke-width="1"/>
    <rect x="-3" y="-23" width="6" height="4" rx="1.2" fill="#ff9fc0"/>
    <path d="M-3 2 L0 8 L3 2 Z" fill="#f6dcc0"/>
    <path d="M-1 5.5 L0 8 L1 5.5 Z" fill="#5a3f52"/>
  </g>
  <circle cx="84" cy="96" r="5.5" fill="#fff" stroke="#f08db3" stroke-width="2.2"/>
  <circle cx="36" cy="96" r="5.5" fill="#fff" stroke="#f08db3" stroke-width="2.2"/>
  <!-- 반짝이 -->
  <path d="M18 54 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#ffd36e"/>
  <path d="M104 64 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2z" fill="#c9b6ff"/>
</svg>
</template>

<template id="heart">
<svg viewBox="0 0 24 22"><path d="M12 20.5 C5 15.5 1.5 12 1.5 7.3 1.5 4 4 1.5 7.1 1.5 9.2 1.5 11 2.7 12 4.5 13 2.7 14.8 1.5 16.9 1.5 20 1.5 22.5 4 22.5 7.3 22.5 12 19 15.5 12 20.5Z" fill="#fff" stroke="#ff9fc0" stroke-width="1.6" stroke-dasharray="2.2 1.6"/></svg>
</template>

<script>
// ───────── 문제 ─────────
// type: story(문장제) · unknown(어떤 수) · cards(수 카드) · compare(식 비교)
// 문제를 바꾸려면 여기만 고치면 돼요. ans 는 정답지에 쓰여요.
const DAYS = [
  { day: 1, cheer: '오늘도 같이 해 보자!', qs: [
    { type: 'story',   text: '색종이가 7장 있었습니다. 미술 시간에 2장을 쓰고, 엄마가 3장을 더 주셨습니다. 지금 색종이는 모두 몇 장인가요?', expr: '7 - 2 + 3', unit: '장', ans: 8 },
    { type: 'unknown', text: '어떤 수에 4를 더했더니 7이 되었습니다. 어떤 수는 얼마인가요?', op: '+', n: 4, result: 7, ans: 3 },
    { type: 'cards',   cards: [5, 8, 3] },
    { type: 'compare', left: '1 + 2 + 3', right: '9 - 1 - 2' },
  ]},
  { day: 2, cheer: '하나씩 천천히~', qs: [
    { type: 'story',   text: '바구니에 사과가 8개 있었습니다. 지우가 2개, 하준이가 3개를 먹었습니다. 바구니에 남은 사과는 몇 개인가요?', expr: '8 - 2 - 3', unit: '개', ans: 3 },
    { type: 'unknown', text: '어떤 수에서 3을 뺐더니 5가 되었습니다. 어떤 수는 얼마인가요?', op: '-', n: 3, result: 5, ans: 8 },
    { type: 'cards',   cards: [2, 6, 4] },
    { type: 'compare', left: '3 + 4 - 2', right: '8 - 4 + 1' },
  ]},
  { day: 3, cheer: '벌써 3일째, 최고야!', qs: [
    { type: 'story',   text: '민재네 냉장고에 딸기 우유가 8개 있었습니다. 아침에 2개를 마시고, 점심에 3개를 더 마셨습니다. 남은 우유는 몇 개인가요?', expr: '8 - 2 - 3', unit: '개', ans: 3 },
    { type: 'unknown', text: '어떤 수에 2를 더했더니 6이 되었습니다. 어떤 수는 얼마인가요?', op: '+', n: 2, result: 6, ans: 4 },
    { type: 'cards',   cards: [1, 7, 5] },
    { type: 'compare', left: '5 + 2 - 1', right: '4 + 3 - 2' },
  ]},
];

const KIND = { story: '문장제', unknown: '어떤 수', cards: '수 카드', compare: '식 비교' };
const calc = s => s.split(' ').reduce((acc, t, i, a) => i === 0 ? +t : (t === '+' ? acc + +a[i + 1] : t === '-' ? acc - +a[i + 1] : acc), 0);
const show = s => s.replace(/-/g, '−');
const box = (cls = '') => `<span class="box ${cls}"></span>`;
const lbl = t => `<span class="lbl">${t}</span>`;

function qHTML(q, i) {
  let body = '';
  if (q.type === 'story') {
    body = `<div class="text">${q.text}</div>
      <div class="row">${lbl('식')} ${show(q.expr)} = ${box()} <span class="gap"></span> ${lbl('답')} ${box()} ${q.unit}</div>`;
  } else if (q.type === 'unknown') {
    body = `<div class="text">${q.text}</div>
      <div class="row">${lbl('식')} ${box('wide')} ${q.op === '+' ? '+' : '−'} ${q.n} = ${q.result} <span class="sub">(□가 어떤 수)</span>
      <span class="gap"></span> ${lbl('답')} ${box()}</div>`;
  } else if (q.type === 'cards') {
    body = `<div class="text">숫자 카드 중에서 2장을 골라 한 번씩 사용하여 ‘몇십몇’을 만들려고 합니다. 가장 큰 수와 가장 작은 수를 구하세요.</div>
      <div class="row"><span class="cards">${q.cards.map(c => `<span class="card">${c}</span>`).join('')}</span>
      <span class="gap"></span> ${lbl('가장 큰 수')} ${box()} <span class="gap"></span> ${lbl('가장 작은 수')} ${box()}</div>`;
  } else {
    body = `<div class="text">계산 결과를 구하고, 알맞은 부등호(&gt;, =, &lt;)를 써넣으세요.</div>
      <div class="row">${show(q.left)} ${box('sign')} ${show(q.right)}</div>
      <div class="row">${lbl('왼쪽')} ${box()} <span class="gap"></span> ${lbl('오른쪽')} ${box()}</div>`;
  }
  const deco = ['♡', '☆', '♡', '✿'][i];
  return `<section class="q"><span class="num">${i + 1}</span><span class="deco">${deco}</span>
    <div class="kind">${KIND[q.type]}</div>${body}</section>`;
}

function answer(q) {
  if (q.type === 'story') return `${show(q.expr)} = <b>${q.ans}</b>, 답 <b>${q.ans}${q.unit}</b>`;
  if (q.type === 'unknown') return `<b>${q.ans}</b> <span class="tip">(${q.result} ${q.op === '+' ? '−' : '+'} ${q.n} = ${q.ans})</span>`;
  if (q.type === 'cards') {
    const s = [...q.cards].sort((a, b) => b - a), t = [...q.cards].filter(c => c).sort((a, b) => a - b);
    return `가장 큰 수 <b>${s[0]}${s[1]}</b>, 가장 작은 수 <b>${t[0]}${t[1]}</b>`;
  }
  const l = calc(q.left), r = calc(q.right);
  return `${l} <b>${l > r ? '&gt;' : l < r ? '&lt;' : '='}</b> ${r}`;
}

const bunny = document.getElementById('bunny').innerHTML;
const heart = document.getElementById('heart').innerHTML;

function dayPage(d) {
  return `<div class="page"><div class="frame"></div>
    <header>
      <div class="titlebox">
        <span class="ribbon">🎀 초등 1학년 수학</span>
        <h1>하루 수학 <small>${d.day}일 차</small></h1>
        <div class="namebar"><span>이름</span><span class="short">월&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일</span></div>
      </div>
      <div class="bubble">${d.cheer}</div>
      <div class="bunny-top">${bunny}</div>
    </header>
    <div class="qs">${d.qs.map(qHTML).join('')}</div>
    <footer>
      <div class="bunny-low">${bunny}</div>
      <div class="hearts">한 문제 풀 때마다 하트를 색칠해요!
        <div class="row-h">${heart.repeat(4)}</div></div>
      <div class="stamp"><b>♥</b>참 잘했어요<br>도장</div>
    </footer>
  </div>`;
}

function answerPage() {
  return `<div class="page ans"><div class="frame"></div>
    <header style="height:28mm">
      <div class="titlebox">
        <span class="ribbon">🔑 엄마 아빠용</span>
        <h1>하루 수학 정답</h1>
        <div class="namebar" style="font-size:9.5pt">어떤 수는 거꾸로 계산해 보게 도와주세요</div>
      </div>
      <div class="bunny-top" style="width:28mm;height:28mm">${bunny}</div>
    </header>
    <div class="ansgrid">${DAYS.map(d => `<div class="ansday"><h3>${d.day}일 차</h3>
      <ol>${d.qs.map(q => `<li>${answer(q)}</li>`).join('')}</ol></div>`).join('')}</div>
  </div>`;
}

const p = new URLSearchParams(location.search);
const out = document.getElementById('out');
if (p.has('answers')) out.innerHTML = answerPage();
else if (p.get('day')) out.innerHTML = dayPage(DAYS.find(d => d.day === +p.get('day')) || DAYS[0]);
else out.innerHTML = DAYS.map(dayPage).join('') + answerPage();
</script>
</body>
</html>
