<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티니핑 도감 💖 시즌 1~6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Gaegu', sans-serif;
    background: linear-gradient(160deg, #fff0f6 0%, #fef6e4 50%, #f0f7ff 100%);
    min-height: 100vh;
    color: #4a3f55;
    padding: 24px 16px 60px;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  .back { display: inline-block; font-family: 'Jua', sans-serif; font-size: 15px; color: #e8698f; text-decoration: none; margin-bottom: 10px; }

  header { text-align: center; margin-bottom: 18px; }
  h1 { font-family: 'Jua', sans-serif; font-size: 28px; color: #e8698f; margin: 4px 0 6px; }
  .intro { font-size: 17px; color: #7a6f85; line-height: 1.5; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; font-family: 'Jua', sans-serif; font-size: 16px; color: #8a7f95;
    background: #fff; border: 2px solid #ffe1ec; border-radius: 999px; padding: 8px 15px; cursor: pointer;
  }
  .tab.on { background: #e8698f; border-color: #e8698f; color: #fff; }

  .tools { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tools input {
    flex: 1; min-width: 160px; font-family: 'Gaegu', sans-serif; font-size: 18px; color: #4a3f55;
    border: 2px solid #ffe1ec; border-radius: 14px; padding: 8px 12px; background: #fff; outline: none;
  }
  .tools input:focus { border-color: #f0a5c0; }
  .toggle {
    font-family: 'Jua', sans-serif; font-size: 15px; color: #e8698f; background: #fff;
    border: 2px solid #ffe1ec; border-radius: 14px; padding: 8px 12px; cursor: pointer;
  }
  .toggle.on { background: #fff5f9; border-color: #e8698f; }

  .season-head { margin: 18px 0 4px; }
  .season-title { font-family: 'Jua', sans-serif; font-size: 22px; color: #4a3f55; }
  .season-sub { font-size: 16px; color: #8a7f95; }
  .group { font-family: 'Jua', sans-serif; font-size: 16px; color: #e8698f; margin: 14px 0 8px; }
  .group span { font-family: 'Gaegu', sans-serif; color: #a99fb5; font-size: 15px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .card {
    background: #fff; border-radius: 18px; border: 2px solid #ffe1ec; border-top: 6px solid var(--c);
    padding: 10px 8px 12px; text-align: center; box-shadow: 0 4px 12px rgba(232,105,143,0.10);
    cursor: default; position: relative;
  }
  .pic { height: 120px; display: flex; align-items: center; justify-content: center; }
  .pic img { max-width: 100%; max-height: 120px; object-fit: contain; }
  .ph {
    width: 84px; height: 84px; border-radius: 50%; background: var(--c); color: #fff;
    font-family: 'Jua', sans-serif; font-size: 34px; display: flex; align-items: center; justify-content: center;
  }
  .name { font-family: 'Jua', sans-serif; font-size: 20px; color: #4a3f55; margin-top: 6px; }
  .en { font-size: 13px; color: #b5abbf; }
  .meaning { display: inline-block; margin-top: 5px; font-size: 14px; color: #fff; background: var(--c); border-radius: 999px; padding: 1px 9px; }

  body.quiz .card { cursor: pointer; }
  body.quiz .card:not(.show) .name,
  body.quiz .card:not(.show) .en,
  body.quiz .card:not(.show) .meaning { visibility: hidden; }
  body.quiz .card:not(.show)::after {
    content: '누구일까? 👆'; position: absolute; left: 0; right: 0; bottom: 22px;
    font-family: 'Jua', sans-serif; font-size: 16px; color: #e8698f;
  }


  .finder-btn { background: #e8698f; border-color: #e8698f; color: #fff; }
  .modal { position: fixed; inset: 0; background: rgba(74,63,85,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal.open { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 18px 16px 26px; position: relative;
  }
  @media (min-width: 560px) { .modal { align-items: center; } .sheet { border-radius: 24px; } }
  .sheet h2 { font-family: 'Jua', sans-serif; font-size: 22px; color: #e8698f; text-align: center; }
  .sheet .x { position: absolute; right: 14px; top: 12px; border: 0; background: none; font-size: 26px; color: #b5abbf; cursor: pointer; }
  .help { text-align: center; color: #8a7f95; font-size: 16px; margin: 6px 0 12px; line-height: 1.45; }
  .pick {
    display: block; text-align: center; font-family: 'Jua', sans-serif; font-size: 18px; color: #fff;
    background: #e8698f; border-radius: 16px; padding: 14px; cursor: pointer;
  }
  .pick input { display: none; }
  .preview { display: none; margin: 12px auto 0; max-width: 100%; max-height: 200px; border-radius: 14px; }
  .status { text-align: center; font-family: 'Jua', sans-serif; color: #8a7f95; font-size: 16px; margin-top: 12px; min-height: 22px; }
  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .results .card { padding: 8px 4px 10px; }
  .results .pic { height: 90px; }
  .results .pic img { max-height: 90px; }
  .results .name { font-size: 17px; }
  .rank { font-size: 22px; line-height: 1; font-family: 'Jua', sans-serif; color: #b5abbf; }
  .seasons { font-size: 13px; color: #8a7f95; margin-top: 3px; }

  .empty { text-align: center; color: #a99fb5; font-size: 18px; padding: 30px 0; }
  footer { text-align: center; margin-top: 30px; font-size: 13px; color: #b5abbf; line-height: 1.7; }
  footer a { color: #b5abbf; }
</style>
</head>

<div class="wrap">
  <a class="back" href="../index.html">‹ 놀이터로</a>
  <header>
    <h1>💖 티니핑 도감 💖</h1>

  <div class="tabs" id="tabs"></div>
  <div class="tools">

  <div id="list"></div>

  <footer>

  </footer>
</div>

<div class="modal" id="finder">

    <label class="pick">사진 찍기 · 고르기<input type="file" id="photo" accept="image/*"></label>
    <img class="preview" id="preview" alt="">
    <div class="status" id="fStatus"></div>
    <div class="results" id="fResults"></div>
    <p class="help" style="font-size:14px;margin-top:14px">티니핑이 화면 가운데에 크게 나오게 찍으면 더 잘 찾아요.<br>사진은 휴대폰 밖으로 나가지 않아요.</p>
  </div>
</div>

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function card(p) {
  const src = 'img/' + encodeURIComponent(p.i.split('/').pop().replace(/\.png$/, '.webp'));
  return `<div class="card" style="--c:${p.c}">
    <div class="pic"><img loading="lazy" src="${src}" alt="${esc(p.k)}"
      onerror="this.outerHTML='<div class=&quot;ph&quot;>${esc(p.k[0])}</div>'"></div>
    <div class="name">${esc(p.k)}</div>
    <div class="en">${esc(p.e)}</div>
    ${p.m ? `<div class="meaning">${esc(p.m)}</div>` : ''}
  </div>`;
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const keys = season === 'all' ? Object.keys(DATA) : [season];
  let html = '', count = 0;
  keys.forEach(s => {
    const rows = DATA[s].filter(p => !q || p.k.includes(q) || p.e.toLowerCase().includes(q) || p.m.includes(q));
    if (!rows.length) return;
    count += rows.length;
    html += `<div class="season-head"><div class="season-title">${label(s)} · ${SEASONS[s][0]}</div>
      <div class="season-sub">${SEASONS[s][1]} · ${rows.length}명</div></div>`;
    const groups = [];
    rows.forEach(p => { let g = groups.find(x => x.name === p.g); if (!g) groups.push(g = { name: p.g, rows: [] }); g.rows.push(p); });
    groups.forEach(g => {
      const note = GROUP_NOTE[g.name];
      html += `<div class="group">${g.name} 티니핑 ${note ? `<span>· ${note}</span>` : ''}</div>
        <div class="grid">${g.rows.map(card).join('')}</div>`;
    });
  });
  listEl.innerHTML = count ? html : '<div class="empty">그런 이름의 티니핑은 없어요 🥲</div>';
}

function drawTabs() {
  const items = [['all', '전체']].concat(Object.keys(DATA).map(s => [s, label(s)]));
  tabsEl.innerHTML = items.map(([k, label]) => `<button class="tab${k === season ? ' on' : ''}" data-k="${k}">${label}</button>`).join('');
}

tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  season = b.dataset.k;
  try { localStorage.setItem('ping-season', season); } catch (e) {}
  drawTabs(); render();
});
qEl.addEventListener('input', render);
document.getElementById('quizBtn').addEventListener('click', e => {
  const on = document.body.classList.toggle('quiz');
  e.currentTarget.classList.toggle('on', on);
  e.currentTarget.textContent = on ? '🙉 이름 보이기' : '🙈 이름 가리기';
  document.querySelectorAll('.card.show').forEach(c => c.classList.remove('show'));
});
listEl.addEventListener('click', e => {
  if (!document.body.classList.contains('quiz')) return;
  const c = e.target.closest('.card'); if (c) c.classList.toggle('show');
});

drawTabs(); render();
</script>

<script>
(() => {
const $ = id => document.getElementById(id);
const modal = $('finder'), statusEl = $('fStatus');
$('finderBtn').addEventListener('click', () => modal.classList.add('open'));
$('finderClose').addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

// 색깔 지도: 색이 뚜렷한 점만 골라 (색상 18칸 × 진하기 3칸)에 몇 개씩 있는지 센다.
// 흰색·회색·검정은 배경과 섞이기 쉬워서 뺀다. 머리가 있는 윗부분과 옷이 있는 아랫부분을 따로 세어
// 머리색이 가장 크게 비교되게 한다. 가슴 무늬가 있는 몸통 윗부분도 따로 센다.
const HB = 18, SB = 3, SMIN = 0.2, VMIN = 0.3, SIZE = 96;
function colorMap(img, centerWeight) {
  const k = Math.min(SIZE / img.naturalWidth, SIZE / img.naturalHeight, 1);
  const W = Math.max(1, Math.round(img.naturalWidth * k)), H = Math.max(1, Math.round(img.naturalHeight * k));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const bin = new Int16Array(W * H).fill(-1), wt = new Float32Array(W * H);
  let y0 = H, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = y * W + x, i = n * 4;
    let w = d[i + 3] / 255;
    if (centerWeight) { const dx = (x - W / 2) / (W * 0.3), dy = (y - H / 2) / (H * 0.3); w *= Math.exp(-(dx * dx + dy * dy) / 2); }
    if (w <= 0) continue;
    const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), ch = mx - mn;
    const s = mx > 0 ? ch / mx : 0;
    if (!(s > SMIN && mx > VMIN)) continue;
    let h = mx === r ? ((g - b) / ch) % 6 : mx === g ? (b - r) / ch + 2 : (r - g) / ch + 4;
    if (h < 0) h += 6;
    bin[n] = Math.min(Math.floor(h / 6 * HB), HB - 1) * SB + Math.min(Math.floor((s - SMIN) / (1 - SMIN) * SB), SB - 1);
    wt[n] = w;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const cut = y0 + (y1 - y0) * 0.45, cut2 = y0 + (y1 - y0) * 0.65;
  const whole = new Float32Array(HB * SB), top = new Float32Array(HB * SB), bot = new Float32Array(HB * SB), chest = new Float32Array(HB * SB);
  for (let n = 0; n < bin.length; n++) {
    if (bin[n] < 0) continue;
    whole[bin[n]] += wt[n];
    const y = Math.floor(n / W);
    (y < cut ? top : bot)[bin[n]] += wt[n];
    if (y >= cut && y < cut2) chest[bin[n]] += wt[n];
  }
  for (const v of [whole, top, bot, chest]) { let t = 0; for (const x of v) t += x; if (t > 0) for (let j = 0; j < v.length; j++) v[j] /= t; }
  return { whole, top, bot, chest };
}
function overlap(a, b) { let m = 0; for (let k = 0; k < a.length; k++) m += Math.min(a[k], b[k]); return m; }
function similar(q, v) {
  return 0.2 * overlap(q.whole, v.whole)
    + 0.8 * (0.6 * overlap(q.top, v.top) + 0.4 * (0.5 * overlap(q.bot, v.bot) + 0.5 * overlap(q.chest, v.chest)));
}
function loadImg(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; });
}

const people = {};   // 영어 이름 → { 카드 정보, 나온 시즌, 그림들 }
Object.entries(DATA).forEach(([s, list]) => list.forEach(p => {
  const f = p.i.split('/').pop().replace(/\.png$/, '.webp');
  const who = people[p.e] || (people[p.e] = { p, seasons: [], files: [] });
  if (!who.seasons.includes(s)) who.seasons.push(s);
  if (!who.files.includes(f)) who.files.push(f);
}));

let catalog = null;
async function loadCatalog() {
  if (catalog) return catalog;
  const out = {};
  const all = [...new Set(Object.values(people).flatMap(w => w.files))];
  await Promise.all(all.map(async f => { out[f] = colorMap(await loadImg('img/' + encodeURIComponent(f)), false); }));
  return (catalog = out);
}

const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('photo').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const pv = $('preview'); pv.src = url; pv.style.display = 'block';
  $('fResults').innerHTML = '';
  statusEl.textContent = '찾는 중…';
  try {
    const cat = await loadCatalog();
    const q = colorMap(await loadImg(url), true);
    const ranked = Object.values(people).map(w => {
      let best = 0;
      w.files.forEach(f => { const m = similar(q, cat[f]); if (m > best) best = m; });
      return { w, score: best };
    }).sort((a, b) => b.score - a.score);
    ranked.length = 6;
    statusEl.textContent = '이 친구 아닐까요?';
    $('fResults').innerHTML = ranked.map(({ w }, i) => {
      const p = w.p;
      return `<div class="card" style="--c:${p.c}">
        <div class="rank">${['🥇', '🥈', '🥉', '4', '5', '6'][i]}</div>
        <div class="pic"><img src="img/${encodeURIComponent(w.files[w.files.length - 1])}" alt="${esc(p.k)}"></div>
        <div class="name">${esc(p.k)}</div>
        <div class="seasons">${w.seasons.map(label).join(', ')}</div>
      </div>`;
    }).join('');
  } catch (err) {
    console.error(err);
    statusEl.textContent = '앗, 잘 안 됐어요. 다른 사진으로 다시 해 주세요.';
  }
  e.target.value = '';
});
})();
</script>
</body>
