<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>랭콘 · 단원별 영어 연습</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --paper:#fdf6e6;      /* 책 종이색 */
    --ink:#3f3021;
    --muted:#8a7a63;
    --leaf:#2f7a33;       /* 주조색 */
    --line:#e5d9bd;
  }
  body{
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; padding:30px 16px 70px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  header{text-align:center;padding-bottom:20px;}
  h1{font-size:30px;color:var(--leaf);letter-spacing:-.5px;}
  .sub{font-family:'Gaegu',sans-serif;font-size:16px;color:var(--muted);margin-top:4px;}

  /* 책 제목줄 아래 삼각 무늬 (책 액자에서 가져왔어요) */
  .band{display:block;width:100%;height:9px;margin:14px 0 6px;}

  .sec{font-family:'Gaegu',sans-serif;font-weight:700;font-size:15px;color:var(--leaf);
       margin:22px 2px 10px;letter-spacing:.3px;}

  /* 단원 칸 — 카드를 겹치지 않고 선으로만 나눕니다 */
  a.unit{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:inherit;
    padding:18px 4px;border-top:1px solid var(--line);
  }
  a.unit:last-of-type{border-bottom:1px solid var(--line);}
  a.unit:active{background:#f6efdc;}

  .cover{
    width:58px;height:58px;flex:none;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.65);
  }
  .c11{background:#cfe8f4;}
  .c12{background:#f7dd9a;}

  .info{flex:1;min-width:0;}
  .no{font-family:'Gaegu',sans-serif;font-size:14px;color:var(--leaf);font-weight:700;}
  .en{font-family:'Trebuchet MS','Segoe UI',sans-serif;font-size:21px;font-weight:700;
       color:var(--ink);margin-top:2px;line-height:1.3;}
  .nm{font-family:'Gaegu',sans-serif;font-size:16px;color:var(--muted);margin-top:2px;display:none;}
  body.kr .nm{display:block;}
  .krbtn{
    background:none;border:1px solid var(--line);border-radius:99px;
    font-family:'Gaegu',sans-serif;font-size:15px;color:var(--muted);
    padding:5px 15px;margin-top:12px;cursor:pointer;
  }
  .krbtn:active{background:#f6efdc;}
  .what{font-family:'Gaegu',sans-serif;font-size:15px;color:var(--muted);margin-top:5px;line-height:1.5;}
  .go{color:var(--leaf);font-size:24px;flex:none;}

  .foot{font-family:'Gaegu',sans-serif;font-size:15px;color:var(--muted);
        text-align:center;margin-top:34px;line-height:1.9;}
  .foot a{color:var(--leaf);text-decoration:none;border-bottom:1px solid #cfe3bf;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>랭콘</h1>
    <div class="sub">단원별로 골라서 연습해요</div>
    <button class="krbtn" id="krBtn" type="button">한글 제목 보이기</button>
    <svg class="band" viewBox="0 0 220 9" preserveAspectRatio="none" aria-hidden="true">
      <g id="t"></g>
    </svg>
  </header>

  <div class="sec">📖 읽기 · 빈칸 채우기 · 문제 풀기</div>

  <a class="unit" href="../ocean/">
    <div class="cover c11">🌊</div>
    <div class="info">
      <div class="no">11단원</div>
      <div class="en">At Home in the Ocean</div>
      <div class="nm">바다가 우리 집</div>
      <div class="what">빈칸 34개 · 문제 23개 · 문장마다 듣기</div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="unit" href="../leopard/">
    <div class="cover c12">🐆</div>
    <div class="info">
      <div class="no">12단원</div>
      <div class="en">How Leopard Got His Spots</div>
      <div class="nm">표범은 어떻게 점박이가 되었나</div>
      <div class="what">빈칸 28개 · 문제 20개 · 문장마다 듣기</div>
    </div>
    <div class="go">›</div>
  </a>

  <div class="foot">
    다음 단원이 나오면 여기에 이어서 넣을 거예요.<br>
    <a href="../secret.html">← 비밀 앱 모음으로</a>
  </div>

</div>

<script>
/* 제목 아래 삼각 무늬 띠 — 책 액자에 있던 무늬예요 */
(function(){
  var g = document.getElementById('t');
  var cols = ['#d2542f','#3f9b3a','#3a8fc4','#f2a33c'];
  var n = 22, w = 220 / n, s = '';
  for(var i=0;i<n;i++){
    var x = i * w;
    s += '<polygon points="'+x+',9 '+(x+w)+',9 '+(x+w/2)+',0" fill="'+cols[i%4]+'"/>';
  }
  g.innerHTML = s;
})();
</script>

<script>
/* 한글 제목 보이기 / 숨기기 — 세 페이지가 같은 설정을 씁니다 */
(function(){
  var KEY = 'langcon-show-kr', b = document.getElementById('krBtn');
  try{ if(localStorage.getItem(KEY) === '1') document.body.classList.add('kr'); }catch(e){}
  function label(){
    b.textContent = document.body.classList.contains('kr') ? '한글 제목 숨기기' : '한글 제목 보이기';
  }
  label();
  b.addEventListener('click', function(){
    document.body.classList.toggle('kr');
    try{ localStorage.setItem(KEY, document.body.classList.contains('kr') ? '1' : '0'); }catch(e){}
    label();
  });
})();
</script>
</body>
</html>
