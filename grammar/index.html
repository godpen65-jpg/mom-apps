<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서현이와 에스 - 영어 동사 만화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF6EC;
  --ink:#2B2420;
  --main:#C8452B;
  --deep:#2F6F5E;
  --line:#E2D5C0;
  --dim:#7A6B5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  font-size:17px;line-height:1.7}
h1,h2,h3{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}

/* ---------- 홈 ---------- */
.top{padding:14px 0 22px}
.top h1{font-size:30px;margin:0 0 6px;color:var(--main)}
.top p{margin:0;color:var(--dim);font-size:15px}

.chapters{margin-top:8px}
.ch{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  border-top:1px solid var(--line);padding:20px 2px;text-align:left}
.chapters .ch:last-child{border-bottom:1px solid var(--line)}
.ch .no{font-family:"Jua",sans-serif;font-size:22px;color:var(--main);
  width:40px;height:40px;flex:0 0 40px;border:2px solid var(--main);border-radius:50%;
  display:grid;place-items:center;line-height:1}
.ch .txt{flex:1;min-width:0}
.ch .ttl{font-family:"Jua",sans-serif;font-size:20px;display:block}
.ch .sub{font-size:14px;color:var(--dim)}
.ch .score{font-size:14px;color:var(--deep);white-space:nowrap}
.ch.done .no{background:var(--main);color:#fff}

/* ---------- 공통 ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.back{background:none;border:0;padding:6px 8px 6px 0;font-size:16px;color:var(--dim)}
.bar .name{font-family:"Jua",sans-serif;font-size:18px}
.bar .step{margin-left:auto;font-size:14px;color:var(--dim)}

/* ---------- 만화 ---------- */
.art{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;padding:14px;
  background:var(--tint,#F3E7D2);display:grid;place-items:center}
.prop{position:absolute}
.prop.pizza{right:7%;bottom:9%;width:30%;max-width:132px}
.prop.s{left:5%;top:8%;width:19%;max-width:78px}
.prop.ed{left:4%;bottom:11%;width:35%;max-width:152px}
.prop.gone{opacity:.22}
.art img{max-width:100%;height:100%;width:auto;object-fit:contain;display:block}
.art .ph{font-size:56px}
.hide{display:none}
.say{margin:14px 2px 0;font-size:17px}
.say b{font-family:"Jua",sans-serif;font-weight:400;color:var(--main)}
.eng{font-family:"Jua",sans-serif;font-size:20px;color:var(--deep);margin-top:6px}

/* ---------- 퀴즈 ---------- */
.ko{color:var(--dim);font-size:15px;margin-bottom:10px}
.sent{font-family:"Jua",sans-serif;font-size:27px;line-height:1.5;margin:0 0 26px}
.sent .blank{color:var(--main);border-bottom:3px solid var(--main);padding:0 10px}
.opts{display:grid;gap:12px}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;
  font-family:"Jua",sans-serif;font-size:23px;transition:border-color .15s ease,background .15s ease}
.opt.ok{border-color:var(--deep);background:#EAF3EF;color:var(--deep)}
.opt.no{border-color:var(--main);background:#FBE9E4;color:var(--main)}
.opt:disabled{cursor:default}
.why{margin-top:18px;padding:14px 16px;border-left:3px solid var(--deep);
  background:#F5EEDF;font-size:15px;border-radius:0 8px 8px 0}
.next{margin-top:22px;width:100%;background:var(--main);color:#fff;border:0;
  border-radius:12px;padding:16px;font-family:"Jua",sans-serif;font-size:20px}
.read{margin-top:16px;width:100%;background:none;border:2px solid var(--deep);color:var(--deep);
  border-radius:12px;padding:13px;font-family:"Jua",sans-serif;font-size:18px}
.read.on{background:var(--deep);color:#fff}

/* ---------- 끝 ---------- */
.end{text-align:center;padding:40px 0}
.end .big{font-size:64px}
.end h2{font-size:26px;margin:14px 0 4px}
.end p{color:var(--dim);margin:0 0 28px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="소리.js"></script>
<script>
/* =========================================================
   만화 2편 + 문제 32개
   동사는 워드업400(unit 9~16) 수준에서 고름. carry, study 같은 단어까지 포함.
   ========================================================= */
const CH = [

    {ph:"⭕", props:["pizza"], ko:"“대신 <b>그, 그녀, 한 명</b>한테는 꼭 붙여야 해.” y로 끝나는 말은 carries처럼 모양이 살짝 바뀌어요.", en:"She likes pizza."}

    {ko:"우리는 바다에 가요.", s:["We "," the sea."], o:["visits","visit"], a:1, w:"We 뒤에는 동사를 그대로 써요."},

    {ko:"어제 우리는 문을 고쳤어요.", s:["Yesterday we "," the door."], o:["fixed","fix"], a:0, w:"어제 일이니까 fixed예요."},

    {ko:"어제 그는 버스를 기다렸어요.", s:["Yesterday he "," for the bus."], o:["wait","waited"], a:1, w:"어제 일이니까 waited예요."},

    {ko:"어제 그들은 집을 지었어요.", s:["Yesterday they "," a house."], o:["built","builded"], a:0, w:"build는 built로 변신해요."},
    {ko:"어제 그가 공을 쳤어요.", s:["Yesterday he "," the ball."], o:["hitted","hit"], a:1, w:"hit은 변신하지 않아요. 그대로 hit이에요."},
    {ko:"어제 그녀는 큰 가방을 들고 다녔어요.", s:["Yesterday she "," a big bag."], o:["carried","carryed"], a:0, w:"carry는 y를 빼고 ied를 붙여 carried가 돼요."},
    {ko:"어제 나는 새 게임을 해 봤어요.", s:["Yesterday I "," a new game."], o:["tryed","tried"], a:1, w:"try도 y를 빼고 ied를 붙여 tried가 돼요."}

const TINT = {1:"#F8E9D5", 2:"#E2E9EF"};

/* 소품 그림. 이모티콘과 같은 굵은 외곽선 · 납작한 색으로 직접 그림 */
const PROPS = {
  /* 서현이가 제일 좋아하는 피자 */
  pizza: `<svg viewBox="0 0 200 200" fill="none"
    stroke="#2B2420" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M28 46 L172 46 L100 182 Z" fill="#F5C84C"/>
    <path d="M26 48 C26 12 174 12 174 48 Z" fill="#E0A55C"/>
    <circle cx="74" cy="84" r="14" fill="#C8452B"/>
    <circle cx="126" cy="92" r="13" fill="#C8452B"/>
    <circle cx="99" cy="130" r="12" fill="#C8452B"/>
  </svg>`,

  /* 파란 요정 에스 */
  s: `<svg viewBox="0 0 120 140">
    <text x="60" y="114" font-family="Jua, sans-serif" font-size="132" text-anchor="middle"
      fill="#4A8FD4" stroke="#2B2420" stroke-width="11" paint-order="stroke">s</text>
    <circle cx="44" cy="62" r="7.5" fill="#2B2420"/>
    <circle cx="76" cy="57" r="7.5" fill="#2B2420"/>
  </svg>`,

  /* 서현이를 쫓아다니는 ed 꼬리 */
  ed: `<svg viewBox="0 0 200 120">
    <g stroke="#2B2420" stroke-width="7" stroke-linecap="round" opacity=".55">
      <line x1="8" y1="36" x2="56" y2="36"/>
      <line x1="0" y1="66" x2="44" y2="66"/>
      <line x1="12" y1="96" x2="54" y2="96"/>
    </g>
    <text x="128" y="96" font-family="Jua, sans-serif" font-size="104" text-anchor="middle"
      fill="#C8452B" stroke="#2B2420" stroke-width="10" paint-order="stroke">ed</text>
  </svg>`
};

function 소품(list){
  return (list || []).map(k=>{
    const [key, ...cls] = k.split(" ");
    return PROPS[key].replace("<svg", `<svg class="prop ${key} ${cls.join(" ")}"`);
  }).join("");
}

/* ===================== 저장 ===================== */
const KEY = "seohyun-grammar-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ===================== 홈 ===================== */
function home(){
  const d = load();
  app.innerHTML = `
  <div class="top">
    <h1>서현이와 에스</h1>
    <p>만화 보고 문제 풀면서 영어 동사 익히기</p>
  </div>
  <div class="chapters">
    ${CH.map(c=>{
      const sc = d[c.id];
      return `<button class="ch ${sc!==undefined?'done':''}" data-id="${c.id}">
        <span class="no">${c.id}</span>
        <span class="txt"><span class="ttl">${c.title}</span><span class="sub">${c.sub}</span></span>
        <span class="score">${sc!==undefined ? sc+" / "+c.quiz.length : ""}</span>
      </button>`;
    }).join("")}
  </div>`;
  app.querySelectorAll(".ch").forEach(b=> b.onclick = ()=> comic(+b.dataset.id, 0));
}

/* ===================== 소리로 읽어주기 =====================
   미리 구워 둔 mp3(소리.js)를 재생한다. 아이폰·아이패드·갤럭시탭 모두 같은 소리가 나야 해서
   브라우저 기본 음성(speechSynthesis) 대신 파일 재생을 쓴다.
   오디오 태그는 하나만 만들어 재사용한다. 아이폰은 사용자가 처음 누른 그 태그만 계속 열어 준다. */
const 소리표 = (typeof SOUND !== "undefined") ? SOUND : {};
const 오디오 = new Audio();
const 주소캐시 = {};
let 큐 = [], 현재버튼 = null;

function 소리주소(k){
  if(!소리표[k]) return null;
  if(!주소캐시[k]){
    const b = atob(소리표[k]), a = new Uint8Array(b.length);
    for(let i=0; i<b.length; i++) a[i] = b.charCodeAt(i);
    주소캐시[k] = URL.createObjectURL(new Blob([a], {type:"audio/mpeg"}));
  }
  return 주소캐시[k];
}

function 버튼복구(){
  if(현재버튼){ 현재버튼.classList.remove("on"); 현재버튼.textContent = "🔊 읽어주기"; }
  현재버튼 = null;
}
function 멈춤(){
  큐 = [];
  try{ 오디오.pause(); }catch(e){}
  버튼복구();
}
function 다음클립(){
  const k = 큐.shift();
  if(!k){ 버튼복구(); return; }
  오디오.src = 소리주소(k);
  const p = 오디오.play();
  if(p && p.catch) p.catch(()=> 멈춤());
}
오디오.onended = 다음클립;
오디오.onerror  = 멈춤;

function 읽기(keys, btn){
  const 다시누름 = (현재버튼 === btn);
  멈춤();
  if(다시누름) return;
  큐 = keys.filter(k => 소리주소(k));
  if(!큐.length) return;
  현재버튼 = btn;
  btn.classList.add("on");
  btn.textContent = "읽는 중…";
  다음클립();
}

/* ===================== 만화 ===================== */
function comic(id, i){
  const c = CH.find(x=>x.id===id), cut = c.cuts[i];
  app.innerHTML = `
  <div class="bar">
    <button class="back">← 목록</button>
    <span class="name">${c.title}</span>
    <span class="step">${i+1} / ${c.cuts.length}</span>
  </div>
  <div class="art" style="--tint:${TINT[id]}">
    <img src="컷/${id}-${i+1}.png" alt=""><span class="ph hide">${cut.ph}</span>
    ${소품(cut.props)}
  </div>
  <p class="say">${cut.ko}</p>
  ${cut.en ? `<p class="eng">${esc(cut.en)}</p>` : ""}
  <button class="read">🔊 읽어주기</button>
  <button class="next">${i+1 < c.cuts.length ? "다음 컷 →" : "문제 풀러 가기 →"}</button>`;

  const img = app.querySelector(".art img");
  img.onerror = ()=>{ img.remove(); app.querySelector(".art .ph").classList.remove("hide"); };

  const 키 = id + "-" + (i+1);
  const rb = app.querySelector(".read");
  if(소리주소("ko:"+키)) rb.onclick = ()=> 읽기(["ko:"+키, "en:"+키], rb);
  else rb.remove();

  app.querySelector(".back").onclick = ()=>{ 멈춤(); home(); };
  app.querySelector(".next").onclick = ()=>{
    멈춤();
    (i+1 < c.cuts.length) ? comic(id, i+1) : quiz(id, 0, 0);
  };
}

/* ===================== 퀴즈 ===================== */
function quiz(id, i, right){
  const c = CH.find(x=>x.id===id);
  if(i >= c.quiz.length) return done(id, right);
  const q = c.quiz[i];
  app.innerHTML = `
  <div class="bar">
    <button class="back">← 목록</button>
    <span class="name">${c.title}</span>
    <span class="step">${i+1} / ${c.quiz.length}</span>
  </div>
  <p class="ko">${q.ko}</p>
  <p class="sent">${esc(q.s[0])}<span class="blank">?</span>${esc(q.s[1])}</p>
  <div class="opts">
    ${q.o.map((t,n)=>`<button class="opt" data-n="${n}">${esc(t)}</button>`).join("")}
  </div>
  <div class="why hide"></div>
  <button class="next hide">다음 문제 →</button>`;

  app.querySelector(".back").onclick = ()=>{ 멈춤(); home(); };
  const why = app.querySelector(".why"), next = app.querySelector(".next");
  let answered = false;

  app.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
    if(answered) return;
    answered = true;
    const n = +b.dataset.n, ok = (n === q.a);
    app.querySelectorAll(".opt").forEach((x,k)=>{
      x.disabled = true;
      if(k === q.a) x.classList.add("ok");
      else if(k === n) x.classList.add("no");
    });
    app.querySelector(".blank").textContent = q.o[q.a];
    why.textContent = (ok ? "맞았어요. " : "다시 봐요. ") + q.w;
    why.classList.remove("hide");
    next.classList.remove("hide");
    next.onclick = ()=> quiz(id, i+1, right + (ok?1:0));
  });
}

/* ===================== 끝 ===================== */
function done(id, right){
  const c = CH.find(x=>x.id===id), d = load();
  if(d[id] === undefined || right > d[id]){ d[id] = right; save(d); }
  app.innerHTML = `
  <div class="end">
    <div class="big">${right === c.quiz.length ? "🏆" : right >= c.quiz.length-3 ? "🌟" : "🌱"}</div>
    <h2>${right} / ${c.quiz.length} 맞았어요</h2>
    <p>${c.title}</p>
    <button class="next" style="max-width:260px;margin:0 auto">목록으로 →</button>
  </div>`;
  app.querySelector(".next").onclick = home;
}

home();

/* ===== 자체 점검: 문제 데이터가 깨지지 않았는지 ===== */
(function check(){
  CH.forEach(c=>{
    console.assert(c.cuts.length === 4, c.id + "편 컷 수가 4가 아님");
    c.quiz.forEach((q,i)=>{
      console.assert(q.o.length === 2, c.id+"-"+i+" 보기 2개 아님");
      console.assert(q.a === 0 || q.a === 1, c.id+"-"+i+" 정답 번호 이상");
      console.assert(q.s.length === 2 && q.ko && q.w, c.id+"-"+i+" 빠진 항목 있음");
    });
  });
})();
</script>
