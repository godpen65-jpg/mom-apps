<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로미와 에스 - 영어 동사 만화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF6EC;
  --ink:#2B2420;
  --main:#C8452B;
  --deep:#2F6F5E;
  --line:#E2D5C0;
  --dim:#7A6B5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  font-size:17px;line-height:1.7}
h1,h2,h3{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}

/* ---------- 홈 ---------- */
.top{padding:14px 0 22px}
.top h1{font-size:30px;margin:0 0 6px;color:var(--main)}
.top p{margin:0;color:var(--dim);font-size:15px}

.chapters{margin-top:8px}
.ch{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  border-top:1px solid var(--line);padding:20px 2px;text-align:left}
.chapters .ch:last-child{border-bottom:1px solid var(--line)}
.ch .no{font-family:"Jua",sans-serif;font-size:22px;color:var(--main);
  width:40px;height:40px;flex:0 0 40px;border:2px solid var(--main);border-radius:50%;
  display:grid;place-items:center;line-height:1}
.ch .txt{flex:1;min-width:0}
.ch .ttl{font-family:"Jua",sans-serif;font-size:20px;display:block}
.ch .sub{font-size:14px;color:var(--dim)}
.ch .score{font-size:14px;color:var(--deep);white-space:nowrap}
.ch.done .no{background:var(--main);color:#fff}

/* ---------- 공통 ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.back{background:none;border:0;padding:6px 8px 6px 0;font-size:16px;color:var(--dim)}
.bar .name{font-family:"Jua",sans-serif;font-size:18px}
.bar .step{margin-left:auto;font-size:14px;color:var(--dim)}

/* ---------- 만화 ---------- */
.art{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;padding:14px;
  background:var(--tint,#F3E7D2);display:grid;place-items:center}
.prop{position:absolute}
.prop.pizza{right:7%;bottom:9%;width:30%;max-width:132px}
.prop.s{left:5%;top:8%;width:19%;max-width:78px}
.prop.ed{left:4%;bottom:11%;width:35%;max-width:152px}
.prop.gone{opacity:.22}
.art img{max-width:100%;height:100%;width:auto;object-fit:contain;display:block}
.art .ph{font-size:56px}
.hide{display:none}
.say{margin:14px 2px 0;font-size:17px}
.say b{font-family:"Jua",sans-serif;font-weight:400;color:var(--main)}
.eng{font-family:"Jua",sans-serif;font-size:20px;color:var(--deep);margin-top:6px}


/* ---------- 영상 ---------- */
.tovid{margin-left:auto;background:none;border:0;padding:6px 0;
  font-size:14px;color:var(--deep)}
.bar .tovid+.step{margin-left:14px}
.vid{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;
  display:block;animation:cutIn .34s cubic-bezier(.22,.7,.3,1) both}

/* ---------- 장면 만화(2편) ---------- */
.art.scene{aspect-ratio:16/9;padding:0;border-radius:12px}
.art.scene img{width:100%;height:100%;object-fit:cover;
  animation:drift 16s ease-in-out infinite}
.art{animation:cutIn .34s cubic-bezier(.22,.7,.3,1) both}

/* 말풍선 */
.bubble{position:absolute;max-width:58%;z-index:2;background:#fff;color:var(--ink);
  border:3px solid var(--ink);border-radius:16px;padding:9px 12px;
  font-size:15px;line-height:1.45;box-shadow:3px 3px 0 rgba(43,36,32,.16);
  opacity:0;animation:pop .42s cubic-bezier(.2,.9,.3,1) .5s forwards}
.bubble b{display:block;font-family:"Jua",sans-serif;font-weight:400;
  color:var(--main);font-size:13px;margin-bottom:1px}
.bubble::before,.bubble::after{content:"";position:absolute;
  border:12px solid transparent;border-top-color:var(--ink)}
.bubble::after{border-top-color:#fff}
.bubble.b-bl{left:20px;bottom:16px}
.bubble.b-bl::before{left:22px;top:-24px;
  border-top-color:transparent;border-bottom-color:var(--ink)}
.bubble.b-bl::after{left:22px;top:-19px;
  border-top-color:transparent;border-bottom-color:#fff}
.bubble.b-tl{left:20px;top:16px}
.bubble.b-tr{right:20px;top:16px}
.bubble.b-tl::before{left:22px;bottom:-24px}
.bubble.b-tl::after{left:22px;bottom:-19px}
.bubble.b-tr::before{right:22px;bottom:-24px}
.bubble.b-tr::after{right:22px;bottom:-19px}

/* 시간 띠 */
.tl{display:flex;align-items:center;gap:10px;margin:0 2px 12px;
  font-family:"Jua",sans-serif;font-size:14px;color:var(--dim)}
.tl i{flex:1;height:2px;background:var(--line);font-style:normal}
.tl span{display:inline-flex;align-items:center;gap:6px}
.tl span::before{content:"";width:9px;height:9px;border-radius:50%;
  border:2px solid var(--line);background:var(--bg)}
.tl span.on{color:var(--main)}
.tl span.on::before{background:var(--main);border-color:var(--main)}

/* 동사 변신기 */
.morph{display:flex;flex-direction:column;align-items:center;gap:0;
  margin:16px 0 2px;padding:13px 0 15px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:"Jua",sans-serif;font-size:26px;line-height:1.2}
.morph .m-row{display:flex;align-items:baseline;justify-content:center;
  gap:0;flex-wrap:wrap}
.morph .m-tag{font-family:"Gowun Dodum",sans-serif;font-size:14px;
  color:var(--main);margin-bottom:7px;opacity:0;
  animation:fadeIn .3s ease-out .35s forwards}
.morph .m-tag.same{color:var(--dim)}
.morph .m-a{color:var(--ink)}
.morph .m-row.pre .m-b{margin-right:.22em}
.morph .m-b{color:var(--main);opacity:0;
  animation:flyIn .5s cubic-bezier(.2,.9,.3,1) .8s forwards}
.morph .m-eq,.morph .m-ar{color:var(--dim);font-size:20px;margin:0 12px;opacity:0;
  animation:fadeIn .3s ease-out 1.25s forwards}
.morph .m-ar{animation-delay:.8s}
.morph .m-r{color:var(--deep);opacity:0;
  animation:pop .4s cubic-bezier(.2,.9,.3,1) 1.4s forwards}
.morph .m-ar+.m-r{animation-delay:1.05s}
.morph .m-r.same{color:var(--dim)}

@keyframes cutIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drift{0%{transform:scale(1.01)}50%{transform:scale(1.05) translate(-.8%,-.8%)}100%{transform:scale(1.01)}}
@keyframes pop{0%{opacity:0;transform:scale(.72)}62%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes flyIn{0%{opacity:0;transform:translateX(46px) rotate(14deg)}70%{opacity:1;transform:translateX(-5px) rotate(-4deg)}100%{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes okPop{40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes noShake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}100%{transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important}
}

/* ---------- 퀴즈 ---------- */
.ko{color:var(--dim);font-size:15px;margin-bottom:10px}
.sent{font-family:"Jua",sans-serif;font-size:27px;line-height:1.5;margin:0 0 26px}
.sent .blank{color:var(--main);border-bottom:3px solid var(--main);padding:0 10px}
.opts{display:grid;gap:12px}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;
  font-family:"Jua",sans-serif;font-size:23px;transition:border-color .15s ease,background .15s ease}
.opt.ok{border-color:var(--deep);background:#EAF3EF;color:var(--deep);animation:okPop .36s ease-out}
.opt.no{border-color:var(--main);background:#FBE9E4;color:var(--main);animation:noShake .38s ease-out}
.opt:disabled{cursor:default}
.why{margin-top:18px;padding:14px 16px;border-left:3px solid var(--deep);
  background:#F5EEDF;font-size:15px;border-radius:0 8px 8px 0}
.next{margin-top:22px;width:100%;background:var(--main);color:#fff;border:0;
  border-radius:12px;padding:16px;font-family:"Jua",sans-serif;font-size:20px}
.read{margin-top:16px;width:100%;background:none;border:2px solid var(--deep);color:var(--deep);
  border-radius:12px;padding:13px;font-family:"Jua",sans-serif;font-size:18px}
.read.on{background:var(--deep);color:#fff}

/* ---------- 끝 ---------- */
.end{text-align:center;padding:40px 0}
.end .big{font-size:64px}
.end h2{font-size:26px;margin:14px 0 4px}
.end p{color:var(--dim);margin:0 0 28px}
</style>
</head>

const TINT = {1:"#F8E9D5", 2:"#E2E9EF", 3:"#F6EFD8"};

/* 소품 그림. 이모티콘과 같은 굵은 외곽선 · 납작한 색으로 직접 그림 */
const PROPS = {
  /* 로미가 제일 좋아하는 피자 */
  pizza: `<svg viewBox="0 0 200 200" fill="none"
    stroke="#2B2420" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M28 46 L172 46 L100 182 Z" fill="#F5C84C"/>
    <path d="M26 48 C26 12 174 12 174 48 Z" fill="#E0A55C"/>
    <circle cx="74" cy="84" r="14" fill="#C8452B"/>
    <circle cx="126" cy="92" r="13" fill="#C8452B"/>
    <circle cx="99" cy="130" r="12" fill="#C8452B"/>
  </svg>`,

  /* 파란 요정 에스 */
  s: `<svg viewBox="0 0 120 140">
    <text x="60" y="114" font-family="Jua, sans-serif" font-size="132" text-anchor="middle"
      fill="#4A8FD4" stroke="#2B2420" stroke-width="11" paint-order="stroke">s</text>
    <circle cx="44" cy="62" r="7.5" fill="#2B2420"/>
    <circle cx="76" cy="57" r="7.5" fill="#2B2420"/>
  </svg>`,

  /* 로미를 쫓아다니는 ed 꼬리 */
  ed: `<svg viewBox="0 0 200 120">
    <g stroke="#2B2420" stroke-width="7" stroke-linecap="round" opacity=".55">
      <line x1="8" y1="36" x2="56" y2="36"/>
      <line x1="0" y1="66" x2="44" y2="66"/>
      <line x1="12" y1="96" x2="54" y2="96"/>
    </g>
    <text x="128" y="96" font-family="Jua, sans-serif" font-size="104" text-anchor="middle"
      fill="#C8452B" stroke="#2B2420" stroke-width="10" paint-order="stroke">ed</text>
  </svg>`
};

function 소품(list){
  return (list || []).map(k=>{
    const [key, ...cls] = k.split(" ");
    return PROPS[key].replace("<svg", `<svg class="prop ${key} ${cls.join(" ")}"`);
  }).join("");
}

/* ===================== 저장 ===================== */
const KEY = "romi-grammar-v1";
const 예전KEY = "seohyun-grammar-v1";          /* 이름 바꾸기 전 점수도 살린다 */
function load(){
  try{
    return JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(예전KEY)) || {};
  }catch(e){ return {}; }
}
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ===================== 홈 ===================== */
function home(){
  const d = load();
  app.innerHTML = `
  <div class="top">
    <h1>로미와 에스</h1>
    <p>만화 보고 문제 풀면서 영어 동사 익히기</p>
  </div>
  <div class="chapters">
    ${CH.map(c=>{
      const sc = d[c.id];
      return `<button class="ch ${sc!==undefined?'done':''}" data-id="${c.id}">
        <span class="no">${c.id}</span>
        <span class="txt"><span class="ttl">${c.title}</span><span class="sub">${c.sub}</span></span>
        <span class="score">${sc!==undefined ? sc+" / "+c.quiz.length : ""}</span>
      </button>`;
    }).join("")}
  </div>`;
  app.querySelectorAll(".ch").forEach(b=> b.onclick = ()=>{
    const id = +b.dataset.id;
    const c = CH.find(x=>x.id===id);
    c.video ? 영상보기(id) : comic(id, 0);
  });
}

/* ===================== 소리로 읽어주기 =====================
   미리 구워 둔 mp3(소리.js)를 재생한다. 아이폰·아이패드·갤럭시탭 모두 같은 소리가 나야 해서
   브라우저 기본 음성(speechSynthesis) 대신 파일 재생을 쓴다.
   오디오 태그는 하나만 만들어 재사용한다. 아이폰은 사용자가 처음 누른 그 태그만 계속 열어 준다. */
const 소리표 = (typeof SOUND !== "undefined") ? SOUND : {};
const 오디오 = new Audio();
const 주소캐시 = {};
let 큐 = [], 현재버튼 = null;

function 소리주소(k){
  if(!소리표[k]) return null;
  if(!주소캐시[k]){
    const b = atob(소리표[k]), a = new Uint8Array(b.length);
    for(let i=0; i<b.length; i++) a[i] = b.charCodeAt(i);
    주소캐시[k] = URL.createObjectURL(new Blob([a], {type:"audio/mpeg"}));
  }
  return 주소캐시[k];
}

function 버튼복구(){
  if(현재버튼){ 현재버튼.classList.remove("on"); 현재버튼.textContent = "🔊 읽어주기"; }
  현재버튼 = null;
}
function 멈춤(){
  큐 = [];
  try{ 오디오.pause(); }catch(e){}
  버튼복구();
}
function 다음클립(){
  const k = 큐.shift();
  if(!k){ 버튼복구(); return; }
  오디오.src = 소리주소(k);
  const p = 오디오.play();
  if(p && p.catch) p.catch(()=> 멈춤());
}
오디오.onended = 다음클립;
오디오.onerror  = 멈춤;

function 읽기(keys, btn){
  const 다시누름 = (현재버튼 === btn);
  멈춤();
  if(다시누름) return;
  큐 = keys.filter(k => 소리주소(k));
  if(!큐.length) return;
  현재버튼 = btn;
  btn.classList.add("on");
  btn.textContent = "읽는 중…";
  다음클립();
}

/* ===================== 영상 =====================
   만든 만화를 소리와 함께 이어 보는 화면. 컷을 하나씩 넘기는 화면은 그대로 남겨 둔다. */
function 영상보기(id){
  const c = CH.find(x=>x.id===id);
  app.innerHTML = `
  <div class="bar">
    <button class="back">← 목록</button>
    <span class="name">${c.title}</span>
    <span class="step">영상</span>
  </div>
  <video class="vid" controls playsinline webkit-playsinline preload="metadata"
    poster="${c.poster}"><source src="${c.video}" type="video/mp4"></video>
  <p class="say">만화를 <b>1분 33초</b> 영상으로 이어서 볼 수 있어요. 소리를 켜고 보세요.</p>
  <button class="read">만화 컷으로 천천히 보기 →</button>
  <button class="next">문제 풀러 가기 →</button>`;

  app.querySelector(".back").onclick = ()=>{ 멈춤(); home(); };
  app.querySelector(".read").onclick = ()=>{ 멈춤(); comic(id, 0); };
  app.querySelector(".next").onclick = ()=>{ 멈춤(); quiz(id, 0, 0); };
}

/* ===================== 만화 ===================== */
/* 시간 띠. 지금 어느 시간을 배우는지 눈으로 보여 준다 */
function 시간띠(c){
  const [l, r] = c.tl || ["어제", "오늘"];
  const on = c.on || 0;
  return `<div class="tl"><span class="${on===0?"on":""}">${l}</span><i></i>`
    + `<span class="${on===1?"on":""}">${r}</span></div>`;
}

/* 동사 변신기. 꼬리가 날아와 붙고 결과가 톡 나타난다 */
function 변신기(m){
  if(m.three){                       /* 세 시제를 나란히 (3편 마지막 컷) */
    return `<div class="morph"><span class="m-tag">오늘 · 어제 · 내일</span>`
      + `<span class="m-row"><span class="m-a">${esc(m.a)}</span>`
      + `<span class="m-eq">·</span><span class="m-b">${esc(m.b)}</span>`
      + `<span class="m-eq">·</span><span class="m-r">${esc(m.r)}</span></span></div>`;
  }
  const 딱지 = m.kind
    ? (m.kind === "same" ? "꿈쩍도 안 해요" : "아예 변신해요")
    : m.pre ? (m.tag || "동사 앞에 will")
    : (m.b === "ed" ? "ed 꼬리를 붙여요" : "e가 있으니 d 하나만");
  const 줄 = m.kind
    ? `<span class="m-a">${esc(m.a)}</span><span class="m-ar">→</span>`
      + `<span class="m-r${m.kind==="same"?" same":""}">${esc(m.r)}</span>`
    : m.pre                          /* will 은 동사 앞에 선다 */
      ? `<span class="m-b">${esc(m.b)}</span><span class="m-a">${esc(m.a)}</span>`
        + `<span class="m-eq">=</span><span class="m-r">${esc(m.r)}</span>`
      : `<span class="m-a">${esc(m.a)}</span><span class="m-b">${esc(m.b)}</span>`
        + `<span class="m-eq">=</span><span class="m-r">${esc(m.r)}</span>`;
  return `<div class="morph">`
    + `<span class="m-tag${m.kind==="same"?" same":""}">${딱지}</span>`
    + `<span class="m-row${m.pre?" pre":""}">${줄}</span></div>`;
}

function comic(id, i){
  const c = CH.find(x=>x.id===id), cut = c.cuts[i];
  app.innerHTML = `
  <div class="bar">
    <button class="back">← 목록</button>
    <span class="name">${c.title}</span>
    ${c.video ? `<button class="tovid">🎬 영상</button>` : ""}
    <span class="step">${i+1} / ${c.cuts.length}</span>
  </div>
  ${c.scene ? 시간띠(c) : ""}
  <div class="art${c.scene ? " scene" : ""}" style="--tint:${TINT[id]}">
    <img src="컷/${id}-${i+1}.png" alt=""><span class="ph hide">${cut.ph}</span>
    ${소품(cut.props)}
    ${cut.say ? `<div class="bubble b-${cut.at || "tl"}"><b>${esc(cut.who)}</b>${esc(cut.say)}</div>` : ""}
  </div>
  ${cut.morph ? 변신기(cut.morph) : ""}
  <p class="say">${cut.ko}</p>
  ${cut.en ? `<p class="eng">${esc(cut.en)}</p>` : ""}
  <button class="read">🔊 읽어주기</button>
  <button class="next">${i+1 < c.cuts.length ? "다음 컷 →" : "문제 풀러 가기 →"}</button>`;

  const img = app.querySelector(".art img");
  img.onerror = ()=>{ img.remove(); app.querySelector(".art .ph").classList.remove("hide"); };

  const 키 = id + "-" + (i+1);
  const rb = app.querySelector(".read");
  if(소리주소("ko:"+키)) rb.onclick = ()=> 읽기(["ko:"+키, "en:"+키], rb);
  else rb.remove();

  app.querySelector(".back").onclick = ()=>{ 멈춤(); home(); };
  const vb = app.querySelector(".tovid");
  if(vb) vb.onclick = ()=>{ 멈춤(); 영상보기(id); };
  app.querySelector(".next").onclick = ()=>{
    멈춤();
    (i+1 < c.cuts.length) ? comic(id, i+1) : quiz(id, 0, 0);
  };
}

/* ===================== 퀴즈 ===================== */
function quiz(id, i, right){
  const c = CH.find(x=>x.id===id);
  if(i >= c.quiz.length) return done(id, right);
  const q = c.quiz[i];
  app.innerHTML = `
  <div class="bar">
    <button class="back">← 목록</button>
    <span class="name">${c.title}</span>
    <span class="step">${i+1} / ${c.quiz.length}</span>
  </div>
  <p class="ko">${q.ko}</p>
  <p class="sent">${esc(q.s[0])}<span class="blank">?</span>${esc(q.s[1])}</p>
  <div class="opts">
    ${q.o.map((t,n)=>`<button class="opt" data-n="${n}">${esc(t)}</button>`).join("")}
  </div>
  <div class="why hide"></div>
  <button class="next hide">다음 문제 →</button>`;

  app.querySelector(".back").onclick = ()=>{ 멈춤(); home(); };
  const why = app.querySelector(".why"), next = app.querySelector(".next");
  let answered = false;

  app.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
    if(answered) return;
    answered = true;
    const n = +b.dataset.n, ok = (n === q.a);
    app.querySelectorAll(".opt").forEach((x,k)=>{
      x.disabled = true;
      if(k === q.a) x.classList.add("ok");
      else if(k === n) x.classList.add("no");
    });
    app.querySelector(".blank").textContent = q.o[q.a];
    why.textContent = (ok ? "맞았어요. " : "다시 봐요. ") + q.w;
    why.classList.remove("hide");
    next.classList.remove("hide");
    next.onclick = ()=> quiz(id, i+1, right + (ok?1:0));
  });
}

/* ===================== 끝 ===================== */
function done(id, right){
  const c = CH.find(x=>x.id===id), d = load();
  if(d[id] === undefined || right > d[id]){ d[id] = right; save(d); }
  app.innerHTML = `
  <div class="end">
    <div class="big">${right === c.quiz.length ? "🏆" : right >= c.quiz.length-3 ? "🌟" : "🌱"}</div>
    <h2>${right} / ${c.quiz.length} 맞았어요</h2>
    <p>${c.title}</p>
    <button class="next" style="max-width:260px;margin:0 auto">목록으로 →</button>
  </div>`;
  app.querySelector(".next").onclick = home;
}

home();

/* ===== 자체 점검: 문제 데이터가 깨지지 않았는지 ===== */
(function check(){
  CH.forEach(c=>{
    console.assert(c.cuts.length >= 4, c.id + "편 컷이 4개보다 적음");
    c.quiz.forEach((q,i)=>{
      console.assert(q.o.length === 2, c.id+"-"+i+" 보기 2개 아님");
      console.assert(q.a === 0 || q.a === 1, c.id+"-"+i+" 정답 번호 이상");
      console.assert(q.s.length === 2 && q.ko && q.w, c.id+"-"+i+" 빠진 항목 있음");
    });
  });
})();
</script>
