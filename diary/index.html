<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일기 5문장으로 쓰기</title>
<!-- 홈 화면 앱 설치용 (📔 아이콘) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="install.js" defer></script>
<meta name="theme-color" content="#fde2ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #c8195e;
    --pink-soft: #fde7ef;
    --ink: #3d3446;
    --sub: #7a6f85;
    --line: #eadfe6;
    --bg: #fff7fa;
    --card: #ffffff;
    --edge: #ffe1ec; --mid: #f3b4cb;
    --g1: #f08a24; --g2: #e8698f; --g3: #8c5bd6; --g4: #3b82c4; --g5: #2f9e6e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Jua', 'Noto Sans KR', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { font-family: inherit; color: inherit; }
  .app { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }

  /* 위쪽 */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .home { text-decoration: none; font-size: 26px; }
  .apptitle { font-size: 22px; color: var(--pink); flex: 0 1 auto; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .step {
    border: 2px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: 16px; cursor: pointer; color: var(--sub);
  }
  .step.on { background: var(--pink); border-color: var(--pink); color: #fff; }
  .step.done { border-color: var(--mid); color: var(--pink); }

  /* 문장 칸 */
  .stage {
    background: #fff; border-radius: 24px; padding: 20px 18px;
    box-shadow: 0 6px 18px rgba(200,25,94,.08); border: 2px solid var(--edge);
    margin-bottom: 16px;
  }
  .stage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .num {
    width: 38px; height: 38px; border-radius: 50%; background: var(--pink); color: #fff;
    display: grid; place-items: center; font-size: 22px; flex: none;
  }
  .stage-name { font-size: 22px; }
  .sentence { font-size: 28px; line-height: 2.0; word-break: keep-all; }
  .slot {
    display: inline-block; min-width: 72px; padding: 0 12px; margin: 2px 2px;
    border: 3px dashed var(--line); border-radius: 14px; background: var(--bg);
    line-height: 1.5; cursor: pointer; color: #b4a6b0; text-align: center;
    vertical-align: middle;
  }
  .slot.filled { border-style: solid; border-color: var(--mid); background: var(--pink-soft); color: var(--ink); }
  .slot.active { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(200,25,94,.18); animation: blink 1.2s ease-in-out infinite; }
  .slot.opt::after { content: ' (빼도 돼요)'; font-size: 14px; color: #b4a6b0; }
  .slot.opt.filled::after { content: ''; }
  @keyframes blink { 50% { box-shadow: 0 0 0 7px rgba(200,25,94,.08); } }
  .josa { color: var(--ink); }

  .choose { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .choose button {
    flex: 1; min-width: 200px; font-size: 18px; padding: 12px; border-radius: 16px;
    border: 3px solid var(--line); background: #fff; cursor: pointer; text-align: left; line-height: 1.4;
  }
  .choose button.on { border-color: var(--pink); background: var(--pink-soft); }
  .choose b { color: #fff; background: var(--pink); border-radius: 6px; padding: 0 6px; margin-right: 4px; }

  /* 낱말 판 */
  .board {
    background: #fff; border-radius: 24px; padding: 18px 16px;
    border: 2px solid var(--edge); box-shadow: 0 6px 18px rgba(200,25,94,.06);
  }
  .board-title { font-size: 22px; margin-bottom: 4px; }
  .board-hint { font-size: 16px; color: var(--sub); margin-bottom: 12px; font-family: 'Noto Sans KR', sans-serif; }
  .group-label { font-size: 17px; color: var(--pink); margin: 14px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    min-height: 56px; padding: 8px 16px; font-size: 22px; border-radius: 16px;
    border: 3px solid var(--line); background: #fff; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; line-height: 1.25;
  }
  .chip .em { font-size: 26px; }
  .chip:active { transform: scale(.96); }
  .chip.on { border-color: var(--pink); background: var(--pink-soft); }
  .chip.more { border-style: dashed; color: var(--pink); font-size: 18px; min-height: 48px; }
  .chip.big { flex-direction: column; min-width: 96px; padding: 10px 12px; font-size: 20px; }
  .chip.big .em { font-size: 38px; }
  .chip .small { font-size: 14px; color: var(--sub); font-family: 'Noto Sans KR', sans-serif; }

  .row-card {
    display: block; width: 100%; text-align: left; border: 3px solid var(--line); background: #fff;
    border-radius: 18px; padding: 10px 12px; margin-bottom: 10px;
  }
  .row-card.on { border-color: var(--pink); background: #fffafc; }
  .row-act { font-size: 15px; color: var(--sub); margin-bottom: 6px; font-family: 'Noto Sans KR', sans-serif; }
  .row-act b { color: var(--pink); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { border: 3px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 18px; cursor: pointer; }
  .tab.on { color: #fff; }

  .meaning { font-family: 'Noto Sans KR', sans-serif; font-size: 17px; background: #fff7e8; border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
  .moments { font-family: 'Noto Sans KR', sans-serif; font-size: 17px; line-height: 1.8; margin-top: 8px; padding-left: 20px; }

  .write {
    display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 2px dashed var(--line); flex-wrap: wrap;
  }
  .write label { width: 100%; font-size: 18px; color: var(--pink); }
  .write input {
    flex: 1; min-width: 160px; font-size: 24px; padding: 10px 14px; border-radius: 14px;
    border: 3px solid var(--line); background: #fffdfe; font-family: 'Noto Sans KR', sans-serif;
  }
  .write input:focus { outline: none; border-color: var(--pink); }
  .btn {
    font-size: 20px; padding: 10px 18px; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--pink); color: #fff; min-height: 52px;
  }
  .btn.ghost { background: #fff; color: var(--pink); border: 3px solid var(--mid); }
  .btn.gray { background: #efe8ec; color: var(--sub); }
  .btn:disabled { opacity: .4; }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-top: 2px solid var(--edge); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter: blur(6px); z-index: 10;
  }
  .nav-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .nav .btn { flex: 1; font-size: 22px; }

  .note { font-family: 'Noto Sans KR', sans-serif; font-size: 15px; color: var(--sub); margin-top: 10px; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 20px; margin-bottom: 8px; }
  .field input[type=text], .field input[type=date] {
    display: block; width: 100%; min-width: 0; max-width: 100%; font-size: 24px; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--line);
    font-family: 'Noto Sans KR', sans-serif; background: #fff; color: var(--ink);
  }
  /* 아이폰 사파리: 날짜 칸이 자체 최소 너비 때문에 밖으로 넘치는 것 막기 */
  .field input[type=date] { -webkit-appearance: none; appearance: none; min-height: 58px; text-align: left; }
  .field input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .app-top { max-width: 760px; margin: 0 auto; padding: 24px 16px 0; }
  .app-top .top { margin-bottom: 0; }
  .app { padding-top: 12px; }
  #hs-slot { flex: none; }
  @media print { .app-top { display: none !important; } }
  .history { margin-top: 10px; }
  .history button {
    display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; font-size: 18px;
    padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: #fff; margin-bottom: 8px; cursor: pointer;
  }
  .history .x { color: #b4a6b0; padding: 0 6px; }

  /* 완성 화면 */
  .edit-list .ed { margin-bottom: 12px; }
  .edit-list label { font-size: 18px; color: var(--pink); display: block; margin-bottom: 4px; }
  .edit-list textarea, .edit-list input {
    width: 100%; font-size: 21px; line-height: 1.5; padding: 10px 12px; border-radius: 14px;
    border: 3px solid var(--line); font-family: 'Noto Sans KR', sans-serif; resize: vertical; background: #fff;
  }
  .edit-list textarea:focus, .edit-list input:focus { outline: none; border-color: var(--pink); }
  .edit-list .reset { font-size: 14px; border: 0; background: none; color: var(--sub); text-decoration: underline; cursor: pointer; margin-left: 6px; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
  .preview-wrap { overflow: hidden; border-radius: 10px; box-shadow: 0 6px 22px rgba(0,0,0,.12); background: #fff; margin: 14px 0; }
  .preview-scale { transform-origin: top left; }

  /* ===== 인쇄용 11쪽 ===== */
  .sheet {
    width: 210mm; height: 296mm; overflow: hidden; background: #fff; position: relative;
    padding: 13mm 15mm 10mm; font-family: 'Noto Sans KR', sans-serif; color: #222;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sh-kicker { color: var(--pink); font-weight: 700; font-size: 9.5pt; }
  .sh-title { font-size: 25pt; font-weight: 900; margin: 1mm 0 5mm; letter-spacing: -0.5px; }
  .sh-meta { display: flex; gap: 6mm; align-items: flex-end; font-size: 12pt; margin-bottom: 6mm; }
  .sh-meta .f { display: flex; align-items: flex-end; gap: 3mm; }
  .sh-meta .v { border-bottom: 1px solid #333; min-height: 7mm; padding: 0 1mm; font-size: 12.5pt; display: flex; align-items: flex-end; white-space: nowrap; overflow: hidden; }
  .sh-boxes { display: flex; gap: 5mm; margin-bottom: 6mm; }
  .sh-box { flex: 1; border: 1.3px dashed var(--pink); border-radius: 3mm; height: 26mm; padding: 2.5mm 3.5mm; overflow: hidden; }
  .sh-box .t { color: var(--pink); font-weight: 700; font-size: 9pt; margin-bottom: 1.5mm; }
  .sh-box .c { font-size: 13pt; line-height: 1.45; }
  .sh-s { display: flex; gap: 4mm; margin-bottom: 3mm; }
  .sh-n { width: 9.5mm; height: 9.5mm; border-radius: 50%; background: var(--pink); color: #fff; font-weight: 700; font-size: 13pt; display: grid; place-items: center; flex: none; margin-top: -1mm; }
  .sh-body { flex: 1; min-width: 0; }
  .sh-frame { font-size: 9pt; color: #444; height: 5.5mm; white-space: nowrap; }
  .sh-frame .b { display: inline-block; border: 1px solid #999; border-radius: 1.6mm; padding: 0 1.4mm; margin: 0 .6mm; line-height: 1.35; font-size: 8.5pt; }
  .sh-frame .tag { display: inline-block; background: var(--pink); color: #fff; border-radius: 1mm; padding: 0 1.2mm; font-weight: 700; font-size: 8pt; margin-right: 1mm; }
  .sh-lines {
    height: 30mm; position: relative;
    background-image: linear-gradient(to bottom, transparent calc(15mm - 1px), #9a9a9a calc(15mm - 1px), #9a9a9a 15mm);
    background-size: 100% 15mm;
  }
  .sh-text {
    position: absolute; left: 0; right: 0; top: 0;
    font-size: 16.5pt; line-height: 15mm; padding-top: 2.6mm; word-break: keep-all; overflow-wrap: anywhere;
  }
  .sheet.trace .sh-text { color: #b9b9b9; font-weight: 400; }
  .sheet.solid .sh-text { color: #222; font-weight: 500; }
  .sheet.blank .sh-text { display: none; }
  .sh-foot { position: absolute; left: 15mm; right: 15mm; bottom: 7mm; font-size: 6.5pt; color: #888; display: flex; justify-content: space-between; }

  .print-only { display: none; }
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .app, .nav { display: none !important; }
    .print-only { display: block; }
  }

  /* ===== 화면 색 바꾸기 (🎨) ===== */
  html[data-theme="sky"]    { --pink: #1f6fbf; --pink-soft: #e3f0fc; --bg: #f4f9ff; --line: #d6e4f2; --edge: #d7e8fa; --mid: #a9cbef; }
  html[data-theme="green"]  { --pink: #2a8a5c; --pink-soft: #e2f5ea; --bg: #f4fbf6; --line: #d4e8db; --edge: #d3eedd; --mid: #9fd3b4; }
  html[data-theme="purple"] { --pink: #7445c2; --pink-soft: #eee6fb; --bg: #f8f5fe; --line: #e1d8f0; --edge: #e6dcf8; --mid: #c6b2ea; }
  html[data-theme="orange"] { --pink: #d0650f; --pink-soft: #fdebdc; --bg: #fff8f2; --line: #f0dfcf; --edge: #fbe0c8; --mid: #f2bd8f; }
  /* 밤: 검정 바탕에 하얀 글씨 */
  html[data-theme="night"]  { --pink: #ffffff; --pink-soft: #2a2a2a; --bg: #000000; --line: #555555; --edge: #333333; --mid: #888888; --ink: #ffffff; --sub: #cccccc; }
  html[data-theme="night"] body { color: #fff; }
  html[data-theme="night"] .stage, html[data-theme="night"] .board, html[data-theme="night"] .chip, html[data-theme="night"] .step,
  html[data-theme="night"] .row-card, html[data-theme="night"] .choose button, html[data-theme="night"] .tab,
  html[data-theme="night"] input, html[data-theme="night"] textarea, html[data-theme="night"] .slot,
  html[data-theme="night"] .history button, html[data-theme="night"] .themes button { background: #000; color: #fff; border-color: #555; }
  html[data-theme="night"] .chip.on, html[data-theme="night"] .slot.filled, html[data-theme="night"] .choose button.on { background: #2a2a2a; color: #fff; border-color: #fff; }
  html[data-theme="night"] .slot { color: #aaa; }
  html[data-theme="night"] .slot.filled { color: #fff; }
  html[data-theme="night"] .step.on, html[data-theme="night"] .tab.on, html[data-theme="night"] .num { background: #fff !important; color: #000 !important; border-color: #fff !important; }
  html[data-theme="night"] .btn { background: #fff; color: #000; }
  html[data-theme="night"] .btn.ghost, html[data-theme="night"] .btn.gray { background: #000; color: #fff; border: 3px solid #fff; }
  html[data-theme="night"] .choose b, html[data-theme="night"] .tag { background: #fff; color: #000; }
  html[data-theme="night"] .nav { background: #000; border-top-color: #333; }
  html[data-theme="night"] .meaning { background: #1a1a1a; color: #fff; }
  html[data-theme="night"] input::placeholder { color: #999; }
  html[data-theme="night"] .themebtn { background: #000; border-color: #fff; }
  html[data-theme="night"] .sheet { --pink: #000; color: #222; } /* 인쇄 쪽은 하얀 종이라 검정으로 */
  html[data-theme="night"] .field input[type=date], html[data-theme="night"] .field input[type=text], html[data-theme="night"] .write input,
  html[data-theme="night"] .edit-list textarea, html[data-theme="night"] .edit-list input { background: #000; color: #fff; border-color: #777; color-scheme: dark; }
  html[data-theme="night"] .slot.active { border-color: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
  html[data-theme="night"] .sheet .tag { background: #000; color: #fff; }
  /* 홈 화면 추가 안내도 검정에 하얀 글씨 */
  html[data-theme="night"] #hs-add .hs-go span { background: #000 !important; color: #fff !important; border: 1px solid #555; }
  html[data-theme="night"] #hs-add .hs-x { background: #000 !important; color: #fff !important; border: 1px solid #555 !important; }
  .themebtn { margin-right: auto; border: 2px solid var(--line); background: var(--pink-soft); border-radius: 999px; font-size: 22px; width: 44px; height: 44px; cursor: pointer; flex: none; }
  .themes { max-width: 760px; margin: 8px auto 0; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; }
  .themes[hidden] { display: none; }
  .themes button { border: 3px solid transparent; border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #333; }
  .themes button i { width: 22px; height: 22px; border-radius: 50%; display: inline-block; }
  .themes button.on { border-color: var(--pink); }
  .ver { text-align: center; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--sub); margin: 22px 0 6px; line-height: 1.7; }
  .linkbtn { border: 0; background: none; color: var(--pink); text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }
  .vlog { text-align: left; max-width: 560px; margin: 8px auto 0; padding-left: 18px; }
  .vlog b { color: var(--pink); }
  @media print { .themes, .themebtn { display: none !important; } }
  @media (max-width: 480px) { .apptitle { font-size: 19px; } .themebtn { width: 38px; height: 38px; font-size: 19px; } .top { gap: 8px; } }
</style>
</head>
<body>
<div class="app-top"><div class="top"><a class="home" href="../home/" title="처음으로">🏠</a><div class="apptitle">일기 5문장으로 쓰기</div><button type="button" class="themebtn" id="themeBtn" title="화면 색 바꾸기">🎨</button><div id="hs-slot"></div></div><div class="themes" id="themes" hidden></div></div>
<div class="app" id="app"></div>
<div class="nav"><div class="nav-in" id="nav"></div></div>
<div class="print-only" id="printArea"></div>

<!-- 버전을 올리면 ?v= 도 같이 바꿔요 (예전 파일이 남지 않게) -->
<script src="version.js?v=2.2"></script>
<script src="data.js?v=2.2"></script>
<script src="extra.js?v=2.2"></script>
<script>
(function () {
  'use strict';
  var D = window.DIARY_DATA, X = window.DIARY_EXTRA, V = window.DIARY_VERSION || { v: '?', date: '', log: [] };

  /* ---------- 그림(이모지) ---------- */
  var EM_PLACE = { '학교':'🏫','집':'🏠','놀이터':'🛝','공원':'🌳','키즈카페':'🧸','도서관':'📚','마트':'🛒','수영장':'🏊','할머니 댁':'👵','놀이공원':'🎡','바닷가':'🏖️','학원':'🎹','체육관':'🥋' };
  var EM_WHO = { '엄마':'👩','아빠':'👨','동생':'👶','언니':'👧','오빠':'👦','누나':'👧','형':'👦','친구':'🧒','선생님':'🧑‍🏫','할머니':'👵','할아버지':'👴','가족':'👨‍👩‍👧','혼자서':'🙋' };
  var EM_EMO = ['😄','😆','🥰','🤩','😊','🏅','🙏','❤️','😌','🥹','💭','🤝','💓','✨','🤔','😲','😎','🦁','😣','😢','😞','😕','🥺','😔','😠','😟','😳','😒','🙇','😱'];
  var EM_BODY = { '얼굴':'🙂','가슴':'💗','손':'✋','발':'🦶','온몸':'🧍' };
  var WEATHER = [['☀️','맑음'],['⛅','구름'],['🌧️','비'],['❄️','눈'],['🌬️','바람']];
  var GROUP_COLOR = { 1:'var(--g1)', 2:'var(--g2)', 3:'var(--g3)', 4:'var(--g4)', 5:'var(--g5)' };

  /* ---------- 데이터 정리 ---------- */
  function fillers(no) { var f = D.fillers.filter(function (x) { return x.sentence === no; })[0]; return f ? f.groups : []; }
  function group(no, label) { return (fillers(no).filter(function (g) { return g.label.indexOf(label) === 0; })[0] || { words: [] }).words; }
  // "언니·오빠" 같은 낱말은 버튼 둘로 나눈다
  var WHO = [];
  group(1, '누구').forEach(function (w) { w.split('·').forEach(function (p) { WHO.push(p.trim()); }); });
  // 장소 카드 ("학원 · 체육관"은 두 장으로)
  var PLACE_CARDS = [];
  D.places.forEach(function (p, i) { p.place.split('·').forEach(function (n) { PLACE_CARDS.push({ name: n.trim(), idx: i }); }); });

  /* ---------- 조사 ---------- */
  function hasBatchim(word) {
    word = String(word || '').trim();
    if (!word) return false;
    var c = word.charCodeAt(word.length - 1);
    if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
    if (/[0-9]$/.test(word)) return /[013678]$/.test(word); // 일,삼,육,칠,팔,영(공)

    }
    else if (k === 'act') {
      title('행동 (지난 일)', r ? '고른 줄의 행동이 들어가 있어요. 바꿔도 돼요.' : '어떤 행동을 했어요?');
      var acts = [];
      D.places.forEach(function (p) { p.rows.forEach(function (x) { if (acts.indexOf(x.action.past) < 0) acts.push(x.action.past); }); });
      b.appendChild(h('div', { class: 'chips' }, acts.map(function (a) {
        return chip(a, function () {
          S.act = a;
          // 같은 행동의 '다음에' 말도 맞춰 준다
          if (!S._wantTouched) D.places.forEach(function (p) { p.rows.forEach(function (x) { if (x.action.past === a) S.want = x.action.want; }); });
          set('act', a);
        }, { on: S.act === a });
      })));
      b.appendChild(writeBox('act', '행동 직접 쓰기', '예: 만들었다'));
    }
    else if (k === 'who' || k === 'who5') {
      title(k === 'who' ? '누구와 함께했어요?' : '다음에는 누구와?', '"혼자서"를 고르면 "와(과)"가 빠져요.');
      b.appendChild(h('div', { class: 'chips nolimit' }, WHO.map(function (w) {
        return chip(w, function () { set(k, w); }, { big: true, em: EM_WHO[w], on: S[k] === w });
      })));
      b.appendChild(writeBox(k, '누구 직접 쓰기', '예: 사촌 동생'));
    }
    else if (k === 'mom') {
      title('그중에서 언제가 제일 기억에 남아요?', '"○○할 때"로 끝나는 말이에요.');
      var ms = momentsFromScene();
      if (ms.length) { label('📍 ' + (strip(S.what) ? strip(S.what) + josa(S.what, '을', '를') + ' ' + strip(S.act).replace(/다$/, '') + '을 때' : '1번에서 고른 일') ); b.appendChild(chipList(ms, 'mom')); }
      label('어떤 일이든'); b.appendChild(chipList(X.moments_any, 'mom'));
      // 부록의 '이런 순간'도 "○○ 때" 꼴이라 그대로 들어감
      D.emotion_groups.forEach(function (g) {
        var ws = [];
        D.emotions.forEach(function (em) { if (em.part === g.part) em.moments.forEach(function (m) { if (/때$/.test(m) && ws.indexOf(m) < 0) ws.push(m); }); });
        label('💡 ' + g.name + '이 드는 순간'); b.appendChild(chipList(ws, 'mom'));
      });
      b.appendChild(writeBox('mom', '직접 쓰기', '예: 미끄럼틀에서 거꾸로 내려올 때'));
    }
    else if (k === 'feel') {
      title('그때 어떤 감정이었어요?', '얼굴을 누르면 감정 말이 들어가요.');
      b.appendChild(h('div', { class: 'tabs' }, D.emotion_groups.map(function (g) {
        return h('button', { type: 'button', class: 'tab' + (emoTab === g.part ? ' on' : ''), style: emoTab === g.part ? 'background:' + GROUP_COLOR[g.part] + ';border-color:' + GROUP_COLOR[g.part] : 'color:' + GROUP_COLOR[g.part], on: { click: function () { emoTab = g.part; render(); } } }, [g.name]);
      })));
      var list = h('div', { class: 'chips nolimit' });
      D.emotions.forEach(function (em, i) {
        if (em.part !== emoTab) return;
        list.appendChild(chip(em.name, function () { pickEmotion(i); }, { big: true, em: EM_EMO[i], small: feelDefault(em), on: S.emo === i }));
      });
      b.appendChild(list);
      if (e) {
        b.appendChild(h('div', { class: 'meaning' }, [EM_EMO[S.emo] + ' ' + e.name + ': ' + e.meaning]));
        label('💬 ' + e.name + ' — 감정 말을 더 풍성하게');
        b.appendChild(chipList(feelList(e), 'feel'));
      }
      b.appendChild(writeBox('feel', '감정 말 직접 쓰기', '예: 두근두근했다'));
    }
    else if (k === 'much') {
      var longFeel = /\s/.test(strip(S.feel));
      title('얼마나?', longFeel ? '감정 말이 길어서 어울리는 것만 보여요. 안 골라도 돼요.' : '안 골라도 돼요.');
      b.appendChild(chipList(longFeel ? X.much_short : X.much, 'much'));
      b.appendChild(skipBtn('much', '얼마나는 빼기'));
      b.appendChild(writeBox('much', '얼마나 직접 쓰기', '예: 엄청'));
    }
    else if (k === 'mat') {
      title('내 마음은 마치 무엇 같았어요?', '"마치 ○○ 같았다"에 들어갈 말이에요.');
      if (!e) b.appendChild(h('div', { class: 'board-hint' }, ['3번에서 감정을 고르면 비유 재료가 나와요. 직접 써도 돼요.']));
      else {
        var heart = e.body.filter(function (x) { return x.part === '가슴'; })[0];
        var others = [];
        e.body.forEach(function (x) { if (x.part !== '가슴') x.materials.forEach(function (m) { others.push(m); }); });
        label('💗 ' + EM_EMO[S.emo] + ' ' + e.name + ' — 마음과 잘 어울려요'); b.appendChild(chipList(heart ? heart.materials : [], 'mat'));
        label('더 고르기'); b.appendChild(chipList(others, 'mat'));
      }
      b.appendChild(writeBox('mat', '비유 재료 직접 쓰기', '예: 터질 듯한 풍선'));
    }
    else if (k === 'move2') {
      title('나도 모르게 어떻게 되었어요?', '몸이 저절로 움직인 것을 골라요.');
      if (e) { label(EM_EMO[S.emo] + ' ' + e.name + ' — 움직임'); b.appendChild(chipList(e.movements.map(moveSay), 'move2')); }
      else b.appendChild(h('div', { class: 'board-hint' }, ['3번에서 감정을 고르면 움직임이 나와요.']));
      b.appendChild(writeBox('move2', '움직임 직접 쓰기', '예: 얼굴이 빨개졌다'));
    }
    else if (k === 'next') {
      title('다음에는? 앞으로는?', '안 골라도 돼요.');
      b.appendChild(chipList(X.next, 'next'));
      b.appendChild(skipBtn('next', '빼기'));
      b.appendChild(writeBox('next', '직접 쓰기', '예: 내일은'));
    }
    else if (k === 'want') {
      title('어떻게 하고 싶어요?', '"~하고 싶다", "~해야겠다"로 끝나요.');
      var mineW = wantsFromScene();
      var wg = X.wants.slice();
      if (e && e.part >= 4) wg.unshift(wg.pop()); // 속상한·불편한 감정이면 '앞으로는 이렇게'를 먼저
      else if (mineW.length) { label('📍 1번에서 고른 일로'); b.appendChild(chipList(mineW, 'want')); }
      wg.forEach(function (g) { label(g.label); b.appendChild(chipList(g.words, 'want')); });
      if (e && e.part >= 4 && mineW.length) { label('📍 1번에서 고른 일로'); b.appendChild(chipList(mineW, 'want')); }
      b.appendChild(writeBox('want', '직접 쓰기', '예: 더 높이 타 보고 싶다'));
    }
    return simplify(b);
  }
  // 보기 줄이기: 묶음마다 6개까지, 묶음은 처음 2개까지만 보이고 나머지는 '더 보기'
  function simplify(b) {
    Array.prototype.forEach.call(b.querySelectorAll('.chips'), function (c) {
      if (c.classList.contains('nolimit')) return; // 누구·장소처럼 그림 판은 다 보이기
      var items = Array.prototype.filter.call(c.children, function (x) { return x.classList.contains('chip'); });
      if (items.length <= 6) return;
      var hidden = items.slice(6).filter(function (x) { return !x.classList.contains('on'); });
      if (hidden.length < 2) return;
      hidden.forEach(function (x) { x.style.display = 'none'; });
      var more = h('button', { class: 'chip more', type: 'button' }, ['➕ ' + hidden.length + '개 더']);
      more.addEventListener('click', function () { hidden.forEach(function (x) { x.style.display = ''; }); more.remove(); });
      c.appendChild(more);
    });
    var labels = Array.prototype.filter.call(b.children, function (x) { return x.classList.contains('group-label'); });
    if (labels.length > 2) {
      var el = labels[2], list = [];
      while (el && (el.classList.contains('group-label') || el.classList.contains('chips'))) { list.push(el); el = el.nextElementSibling; }
      if (list.length > 2) {
        var wrap = h('div', { style: 'display:none' });
        var btn = h('button', { class: 'btn ghost', type: 'button', style: 'margin-top:14px' }, ['📚 다른 낱말 더 보기']);
        btn.addEventListener('click', function () { wrap.style.display = ''; btn.remove(); });
        b.insertBefore(btn, labels[2]);
        b.insertBefore(wrap, labels[2]);
        list.forEach(function (x) { wrap.appendChild(x); });
      }
    }
    return b;
  }

  /* ---------- 화면: 완성 ---------- */
  function renderDone(app) {
    var st = h('div', { class: 'stage' });
    st.appendChild(h('div', { class: 'stage-head' }, [h('div', { class: 'num' }, ['★']), h('div', { class: 'stage-name' }, ['완성! 마지막으로 고쳐요'])]));
    st.appendChild(h('div', { class: 'board-hint' }, ['아래 칸은 모두 직접 고칠 수 있어요. 고친 내용이 그대로 인쇄돼요.']));
    var list = h('div', { class: 'edit-list' });

    function ed(lbl, value, onInput, onReset, multi) {
      var inp = multi ? h('textarea', { rows: multi }) : h('input', { type: 'text' });
      inp.value = value || '';
      inp.addEventListener('input', function () { onInput(inp.value); save(); paintPreview(); });
      return h('div', { class: 'ed' }, [
        h('label', null, [lbl, onReset ? h('button', { class: 'reset', type: 'button', on: { click: function () { onReset(); save(); render(); } } }, ['고른 낱말로 되돌리기']) : null]),
        inp
      ]);
    }
    var top = h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px' }, [
      ed('날짜', S.date, function (v) { S.date = v; }),
      ed('날씨', S.weather, function (v) { S.weather = v; })
    ]);
    list.appendChild(top);
    list.appendChild(ed('제목', S.title, function (v) { S.title = v; }));
    list.appendChild(ed('오늘의 감정 · 감정 말', emoBox(), function (v) { S.over.emoBox = v; }, function () { delete S.over.emoBox; }, 2));
    list.appendChild(ed('내 마음 그리기 (비유 재료 · 움직임)', matBox(), function (v) { S.over.matBox = v; }, function () { delete S.over.matBox; }, 2));
    for (var n = 1; n <= LAST; n++) (function (n) {
      list.appendChild(ed(n + '. ' + STEP_LONG[n], finalSentence(n), function (v) { S.over['s' + n] = v; }, S.over['s' + n] != null ? function () { delete S.over['s' + n]; } : null, 2));
    })(n);
    st.appendChild(list);
    app.appendChild(st);

    var pb = h('div', { class: 'board' });
    pb.appendChild(h('div', { class: 'board-title' }, ['🖨️ 인쇄하기 (오늘의 일기 쪽)']));
    pb.appendChild(h('div', { class: 'board-hint' }, ['문장 글씨를 어떻게 넣을까요?']));
    pb.appendChild(h('div', { class: 'modes' }, [['solid', '완성본 (진하게)'], ['trace', '따라 쓰기 (연하게)'], ['blank', '빈 칸 (문장 없이)']].map(function (m) {
      return chip(m[1], function () { S.mode = m[0]; save(); render(); }, { on: S.mode === m[0] });
    })));
    pb.appendChild(h('button', { class: 'btn', type: 'button', style: 'width:100%;font-size:24px', on: { click: doPrint } }, ['🖨️ 인쇄 / PDF로 저장']));
    pb.appendChild(h('div', { class: 'note' }, ['인쇄 창에서 "PDF로 저장"을 고르면 PDF 파일이 돼요. 휴대폰은 공유 → 인쇄에서 저장할 수 있어요. 여백은 "없음", 배경 그래픽은 "켜기"로 하면 원본과 똑같이 나와요.']));
    var wrap = h('div', { class: 'preview-wrap', id: 'pvw' }, [h('div', { class: 'preview-scale', id: 'pvs' })]);
    pb.appendChild(wrap);
    app.appendChild(pb);
    paintPreview();
  }

  /* ---------- 인쇄용 쪽 ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function prettyDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if (!m) return esc(d);
    var dt = new Date(+m[1], +m[2] - 1, +m[3]);
    return (+m[1]) + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일 ' + '일월화수목금토'[dt.getDay()] + '요일';
  }
  function B(t) { return '<span class="b">' + t + '</span>'; }
  var FRAMES = [
    '오늘 나는 ' + B('누구') + '와(과) ' + B('어디') + '에서 ' + B('무엇') + '을(를) ' + B('어떻게') + ' ' + B('행동') + '.',
    '그중에서 ' + B('○○할 때') + '가 제일 기억에 남는다.',
    '그때 나는 ' + B('얼마나') + ' ' + B('감정 말') + '.',
    '<span class="tag">가</span>내 마음은 마치 ' + B('비유 재료') + ' 같았다. &nbsp;또는 &nbsp;<span class="tag">나</span>나도 모르게 ' + B('움직임') + '.',
    B('다음에는·앞으로는') + ' ' + B('하고 싶은 일·다짐') + '.'
  ];
  function sheetHTML() {
    var s = '<div class="sheet ' + (S.mode || 'solid') + '">';
    s += '<div class="sh-kicker">일기 쓰기 칸 · 필요한 만큼 인쇄해요</div><div class="sh-title">오늘의 일기</div>';
    s += '<div class="sh-meta"><div class="f">날짜<div class="v" style="width:52mm">' + prettyDate(S.date) + '</div></div>' +
      '<div class="f">날씨<div class="v" style="width:30mm">' + esc(S.weather) + '</div></div>' +
      '<div class="f" style="flex:1">제목<div class="v" style="flex:1">' + esc(S.title) + '</div></div></div>';
    s += '<div class="sh-boxes"><div class="sh-box"><div class="t">오늘의 감정 · 감정 말</div><div class="c">' + esc(emoBox()).replace(/\n/g, '<br>') + '</div></div>' +
      '<div class="sh-box"><div class="t">내 마음 그리기 (비유 재료 · 움직임)</div><div class="c" style="font-size:11.5pt">' + esc(matBox()).replace(/\n/g, '<br>') + '</div></div></div>';
    for (var n = 1; n <= LAST; n++) {
      s += '<div class="sh-s"><div class="sh-n">' + n + '</div><div class="sh-body"><div class="sh-frame">' + FRAMES[n - 1] + '</div>' +
        '<div class="sh-lines"><div class="sh-text">' + esc(finalSentence(n)) + '</div></div></div></div>';
    }
    s += '<div class="sh-foot"><span>일기 5문장으로 쓰기 v' + esc(V.v) + ' · 감정 카드와 장소 카드의 낱말은 새로 쓴 것입니다</span><span>12</span></div>';
    return s + '</div>';
  }
  function paintPreview() {
    var pvs = document.getElementById('pvs'), pvw = document.getElementById('pvw');
    if (!pvs) return;
    pvs.innerHTML = sheetHTML();
    var sh = pvs.firstChild;
    var sc = pvw.clientWidth / sh.offsetWidth;
    pvs.style.transform = 'scale(' + sc + ')';
    pvw.style.height = (sh.offsetHeight * sc) + 'px';
  }
  function doPrint() {
    save();
    document.getElementById('printArea').innerHTML = sheetHTML();
    var done = function () { window.print(); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(done); else done();
  }
  window.addEventListener('resize', paintPreview);

  /* ---------- 전체 그리기 ---------- */
  function go(n) {
    screen = Math.max(0, Math.min(DONE, n)); showMoments = false; showAllMoments = false; browsePlace = null;
    if (screen >= 1 && screen <= LAST) { autofill(screen); save(); }
    active = (screen >= 1 && screen <= LAST) ? firstEmpty(screen) : null;
    render(); window.scrollTo(0, 0);
  }
  function stepDone(i) {
    if (i === 0) return !!S.date;
    if (i >= 1 && i <= LAST) {
      if (S.over['s' + i] != null) return !!strip(S.over['s' + i]);
      return parts(i).every(function (p) { return typeof p !== 'object' || p.opt || !!strip(S[p.k]); });
    }
    return false;
  }
  function render() {
    var app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(h('div', { class: 'steps' }, STEP_NAMES.map(function (nm, i) {
      return h('button', { type: 'button', class: 'step' + (i === screen ? ' on' : stepDone(i) ? ' done' : ''), on: { click: function () { go(i); } } }, [(i >= 1 && i <= LAST ? i + ' ' : '') + nm]);
    })));
    if (screen === 0) renderStart(app);
    else if (screen === DONE) renderDone(app);
    else renderSentence(app, screen);

    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    if (screen > 0) nav.appendChild(h('button', { class: 'btn ghost', type: 'button', on: { click: function () { go(screen - 1); } } }, ['← 이전']));
    if (screen < DONE) nav.appendChild(h('button', { class: 'btn', type: 'button', on: { click: function () { go(screen + 1); } } }, [screen === 0 ? '쓰기 시작 →' : screen === LAST ? '완성 보기 →' : '다음 →']));
    else nav.appendChild(h('button', { class: 'btn', type: 'button', on: { click: doPrint } }, ['🖨️ 인쇄 / PDF']));
  }

  /* ---------- 화면 색 (기기마다 기억) ---------- */
  var THEMES = [['pink', '분홍', '#c8195e'], ['sky', '하늘', '#1f6fbf'], ['green', '초록', '#2a8a5c'], ['purple', '보라', '#7445c2'], ['orange', '주황', '#d0650f'], ['night', '검정', '#000000']];
  function setTheme(t) {
    if (t && t !== 'pink') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('diary.theme', t); } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    var c = THEMES.filter(function (x) { return x[0] === t; })[0];
    if (meta && c) meta.setAttribute('content', t === 'night' ? '#000000' : getComputedStyle(document.documentElement).getPropertyValue('--pink-soft').trim() || '#fde2ef');
    Array.prototype.forEach.call(document.querySelectorAll('#themes button'), function (bt) { bt.classList.toggle('on', bt.dataset.t === t); });
    paintPreview();
  }
  (function () {
    var box = document.getElementById('themes');
    THEMES.forEach(function (t) {
      var bt = h('button', { type: 'button' }, [h('i', { style: 'background:' + t[2] }), t[1]]);
      bt.dataset.t = t[0];
      bt.addEventListener('click', function () { setTheme(t[0]); });
      box.appendChild(bt);
    });
    document.getElementById('themeBtn').addEventListener('click', function () { box.hidden = !box.hidden; });
    var saved = 'pink'; try { saved = localStorage.getItem('diary.theme') || 'pink'; } catch (e) {}
    setTheme(saved);
  })();

  if (S.emo != null) emoTab = D.emotions[S.emo].part;
  render();
})();
</script>
</body>
</html>
