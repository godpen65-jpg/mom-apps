<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 홈 화면 앱 설치용 (🏛️ 아이콘) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="install.js" defer></script>
<meta name="theme-color" content="#ece6f7">
<meta name="robots" content="noindex, nofollow">
<title>3D 뮤지엄 그리스 로마 신화 🏛️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Gaegu', sans-serif;
    background: linear-gradient(160deg, #f1ecfa 0%, #fbf7ef 50%, #eaf1f6 100%);
    min-height: 100vh;
    color: #4a4458;
    padding: 24px 16px 60px;
    overflow-x: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; }

  .back {
    display: inline-block;
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    color: #a99fbd;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .back:hover { color: #7a63b0; }

  header { text-align: center; margin-bottom: 20px; }
  .emoji-top { font-size: 44px; }
  h1 {
    font-family: 'Jua', sans-serif;
    font-size: 25px;
    color: #7a63b0;
    margin: 6px 0 10px;
    line-height: 1.35;
  }
  .intro { font-size: 17px; color: #7d7590; line-height: 1.6; }
  .intro b { color: #7a63b0; }

  /* 파트 버튼 (누르면 그 파트만 보임) */
  .tabs {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 8px 0 10px;
    margin-bottom: 14px;
    background: linear-gradient(#f1ecfa 85%, rgba(241,236,250,0));
  }
  .tab {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    line-height: 1.25;
    padding: 9px 4px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--c);
    cursor: pointer;
  }
  .tab.on { background: var(--c); border-color: var(--c); color: #fff; }
  .w-all { --c: #7a63b0; --soft: #f1ecfa; --line: #e0d7f1; }
  .world[hidden] { display: none; }

  /* 세계 (3묶음) */
  .world { margin-bottom: 26px; scroll-margin-top: 12px; }
  .world-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 4px 10px; }
  .world-name { font-family: 'Jua', sans-serif; font-size: 21px; }
  .world-sub { font-size: 15.5px; color: #9a92a8; }

  .w-olympus { --c: #3f8fa6; --soft: #e5f3f6; --line: #cfe8ee; }
  .w-dynamic { --c: #a8407a; --soft: #f8e8f1; --line: #f0d3e3; }
  .w-heroes  { --c: #d0791c; --soft: #fdf0de; --line: #f6dfbd; }
  .world-name { color: var(--c); }

  /* 책 카드 */
  .book {
    background: #fff;
    border-radius: 20px;
    padding: 13px 14px 14px;
    margin-bottom: 11px;
    border: 2px solid var(--line);
    box-shadow: 0 5px 14px rgba(90,70,130,0.08);
  }
  .book-top { display: flex; align-items: center; gap: 11px; }
  .vol {
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    color: #fff;
    background: var(--c);
    min-width: 42px; height: 42px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .book-title { font-family: 'Jua', sans-serif; font-size: 18px; line-height: 1.3; }
  .book-eps { font-size: 15.5px; color: #8a8298; line-height: 1.35; margin-top: 1px; }

  .btns { display: flex; gap: 8px; margin-top: 11px; }
  .btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-family: 'Jua', sans-serif;
    font-size: 15.5px;
    text-decoration: none;
    padding: 10px 6px;
    border-radius: 14px;
    transition: transform .1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.video { background: var(--c); color: #fff; }
  .btn.audio { background: var(--soft); color: var(--c); border: 2px solid var(--line); }

  /* 사진 없는 권 */
  .book.missing { background: #faf9fc; border-style: dashed; box-shadow: none; }
  .book.missing .vol { background: #cfc9d9; }
  .book.missing .book-title { color: #a9a2b5; }
  .missing-note { font-size: 15px; color: #b3a9c4; margin-top: 8px; }

  .notice {
    background: #f6f2fc;
    border: 2px solid #e4dcf3;
    border-radius: 18px;
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 14.5px;
    color: #857c99;
    line-height: 1.6;
  }
  .notice-title { font-family: 'Jua', sans-serif; font-size: 15px; color: #7a63b0; margin-bottom: 7px; }
  .notice li { margin-left: 16px; margin-bottom: 4px; }

  footer { text-align: center; margin-top: 26px; font-size: 15px; color: #a99fbd; line-height: 1.7; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../secret/">‹ 비밀 앱 모음</a>

    <header>
      <div class="emoji-top">🏛️⚡</div>
      <h1>3D 뮤지엄 그리스 로마 신화</h1>
      <p class="intro">
        책 앞장 QR코드를 한곳에 모았어요.<br>
        <b>🎬 영상</b>은 북쇼츠, <b>🎧 듣기</b>는 전체 이야기예요.<br>
        책 안 펼치고 바로 눌러서 보세요 🎈
      </p>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <div id="list"></div>

    <div class="notice">
      <div class="notice-title">💡 알아두면 좋아요</div>
      <ul>
        <li>링크는 책에 있는 QR코드 주소 그대로예요. 교원 쪽에서 열려요.</li>
        <li>회색 점선 칸은 아직 사진을 안 찍은 권이에요.</li>
        <li>우리 집 책 보면서 쓰려고 만든 페이지예요. 밖에 공유하지 말아 주세요.</li>
      </ul>
    </div>

    <footer>교원 빨간펜 「3D 뮤지엄 그리스 로마 신화」 (2026년 10월 1판)</footer>
  </div>

<script>
// [권, 권 제목, 에피소드, 북쇼츠 영상 QR, 전체 이야기 QR]
// QR이 없는 권(사진 안 찍은 권)은 링크 자리에 null
const QR = 'http://qr.kyowon.kr/';
const WORLDS = [
  { id: 'olympus', cls: 'w-olympus', name: '올림포스 월드', sub: '올림포스 신들의 이야기', books: [
    [1,  '올림포스 신들의 탄생',     '',                                    null,        null],
    [2,  '세상을 움직이는 신',       '제우스와 헤라 · 술의 신 디오니소스',      '1UnDeH6Sh4', '1UnDd94bIi'],
    [3,  '삼지창과 올리브나무',      '바다의 신 포세이돈 · 지혜의 여신 아테나',  '1UnDeH7plJ', '1UnDd954B5'],
    [4,  '풍요와 사랑의 어머니',     '풍요의 여신 데메테르 · 사랑의 여신 아프로디테', '1UnDeH8Wwm', '1UnDd9M4Hy'],
    [5,  '불과 함께하는 신',         '대장장이 신 헤파이스토스 · 화로의 여신 헤스티아', '1UnDeH8s1H', '1UnDd9MAGz'],
    [6,  '쌍둥이 신의 슬픔',         '태양의 신 아폴론 · 달의 여신 아르테미스',  '1UnDeHGS6U', '1UnDd9MER6'],
    [7,  '영리한 전령과 난폭한 전사', '전령의 신 헤르메스 · 전쟁의 신 아레스',    '1UnDeHGcFZ', '1UnDd9MI4x'],
    [8,  '영원을 꿈꾼 사랑',         '에로스와 프시케 · 아르테미스와 엔디미온',  '1UnDeHGvVA', '1UnDd9MVbi'],
    [9,  '홀로 남은 태양신',         '아폴론과 다프네 · 아폴론과 히아킨토스',    '1UnDeHHKDT', '1UnDd9MYjJ'],
    [10, '신의 노여움을 산 인간',     '아테나와 아라크네 · 아르테미스와 악타이온', '1UnDeHHSnm', '1UnDd9McNA'],
  ]},
  { id: 'dynamic', cls: 'w-dynamic', name: '다이내믹 랜드', sub: '땅에서 벌어지는 인간과 신의 이야기', books: [
    [11, '인간을 향한 사랑과 벌',     '프로메테우스와 판도라 · 데우칼리온과 피라', '1UnDeHHudd', '1UnDd9NQa7'],
    [12, '질투가 바꾼 운명',         '이오와 칼리스토 · 케팔로스와 프로크리스',  '1UnDeHIEvk', '1UnDd9NUU6'],
    [13, '피할 수 없는 심판',        '니오베 · 이비코스',                     '1UnDeHIYhb', '1UnDd9NXbh'],
    [14, '죽음을 거스른 사랑',       '오르페우스와 에우리디케 · 아드메토스와 알케스티스', '1UnDeHIwNO', '1UnDd9NlOa'],
    [15, '신이 준 특별한 선물',      '아리온 · 아탈란타',                     '1UnDeHJ5Tx', '1UnDd9NoWB'],
    [16, '테베 왕가의 눈물',         '오이디푸스 · 안티고네',                  '1UnDeHJQoa', '1UnDd9Nrdm'],
    [17, '후회만 남은 선택',         '미다스왕 · 아프로디테와 아도니스',        '1UnDeHJpGl', '1UnDd9NuVF'],
    [18, '혼자만의 외로운 사랑',     '에코와 나르키소스 · 클리티에',            '1UnDeHJxKo', '1UnDd9Nxcq'],
    [19, '사랑이 빚어낸 기적',       '피그말리온 · 베르툼누스와 포모나',        null,        null],
    [20, '신을 맞이하는 방법',       '바우키스와 필레몬 · 레토와 농부들',       '1UnDeHKncq', '1UnDd9ODkw'],
  ]},
  { id: 'heroes', cls: 'w-heroes', name: '히어로즈 로드', sub: '영웅들의 탐험과 모험 이야기', books: [
    [21, '메두사를 물리친 페르세우스', '',                                    '1UnDeHL6cJ', '1UnDd9OGcP'],
    [22, '뱀의 이빨과 개미 군단',     '카드모스 · 미르미돈',                   '1UnDeHLCbK', '1UnDd9OJTs'],
    [23, '헤라클레스의 열두 과업',    '',                                    '1UnDeHM0I1', '1UnDd9OLp5'],
    [24, '시련 속에서 일어선 영웅들', '이아손의 모험 · 암피온과 제토스',         '1UnDeHMHyq', '1UnDd9OaeU'],
    [25, '미궁을 빠져나온 사람들',    '테세우스의 모험 · 다이달로스와 이카로스',  '1UnDeHMTQZ', '1UnDd9OdVx'],
    [26, '트로이 전쟁 1',            '',                                    '1UnDeHMmQ2', '1UnDd9OgNQ'],
    [27, '트로이 전쟁 2',            '',                                    '1UnDeHNDjd', '1UnDd9Oiyl'],
    [28, '오디세우스의 귀향 1',       '',                                    '1UnDeHNL1I', '1UnDd9OlqE'],
    [29, '오디세우스의 귀향 2',       '',                                    '1UnDeHNdkd', '1UnDd9Oohh'],
    [30, '아이네이아스의 새로운 시작', '',                                    '1UnDeHNmKw', '1UnDd9P1iC'],
  ]},
];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs = document.getElementById('tabs');
const list = document.getElementById('list');

// 파트 버튼: 전체 + 세 파트. 누르면 그 파트 책만 전부 보임
const TABS = [{ id: 'all', cls: 'w-all', label: '전체' }]
  .concat(WORLDS.map(w => ({ id: w.id, cls: w.cls, label: w.name.replace(' ', '<br>') })));
for (const t of TABS) {
  const b = document.createElement('button');
  b.className = 'tab ' + t.cls;
  b.dataset.id = t.id;
  b.innerHTML = t.label;
  b.onclick = () => { show(t.id); window.scrollTo({ top: list.offsetTop - 70, behavior: 'smooth' }); };
  tabs.appendChild(b);
}

function show(id) {
  for (const b of tabs.children) b.classList.toggle('on', b.dataset.id === id);
  for (const s of list.children) s.hidden = id !== 'all' && s.id !== id;
  try { localStorage.setItem('greek-myth-tab', id); } catch (e) {}
}

for (const w of WORLDS) {
  const sec = document.createElement('section');
  sec.className = 'world ' + w.cls;
  sec.id = w.id;
  let html = `<div class="world-head"><span class="world-name">${esc(w.name)}</span><span class="world-sub">${esc(w.sub)}</span></div>`;
  for (const [vol, title, eps, video, audio] of w.books) {
    const top = `<div class="book-top"><div class="vol">${vol}</div><div>
        <div class="book-title">${esc(title)}</div>${eps ? `<div class="book-eps">${esc(eps)}</div>` : ''}</div></div>`;
    if (!video) {
      html += `<div class="book missing">${top}<div class="missing-note">📷 아직 QR 사진이 없어요</div></div>`;
      continue;
    }
    html += `<div class="book">${top}<div class="btns">
        <a class="btn video" href="${QR + video}" target="_blank" rel="noopener">🎬 영상 보기</a>
        <a class="btn audio" href="${QR + audio}" target="_blank" rel="noopener">🎧 이야기 듣기</a>
      </div></div>`;
  }
  sec.innerHTML = html;
  list.appendChild(sec);
}

// 처음엔 첫 파트(올림포스)만. 마지막에 본 파트를 기억해서 다음에 그 파트로 열림
let saved = null;
try { saved = localStorage.getItem('greek-myth-tab'); } catch (e) {}
show(TABS.some(t => t.id === saved) ? saved : WORLDS[0].id);
</script>
</body>
</html>
